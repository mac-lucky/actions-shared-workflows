name: Verify Deployed Image
description: Verify that deployed image can be pulled from GitHub Container Registry

inputs:
  registry_image:
    description: Full GHCR image URL (e.g., ghcr.io/owner/image-name)
    required: true
  github_token:
    description: GitHub token for GHCR authentication
    required: true
  tag:
    description: >-
      Image tag to verify. Callers pass the version they just published;
      prerelease versions never move latest, so verifying latest would check
      a stale artifact.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Verify image pull and functionality
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        echo "Verifying ${REGISTRY_IMAGE}:${TAG} can be pulled from GHCR..."
        for i in $(seq 1 5); do
          if docker pull ${REGISTRY_IMAGE}:${TAG}; then
            break
          fi
          echo "Attempt $i/5 failed, retrying in 15s..."
          sleep 15
        done
        docker inspect ${REGISTRY_IMAGE}:${TAG} > /dev/null
        echo "Image verification successful"
