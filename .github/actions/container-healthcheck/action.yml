name: Container Health Check
description: Run container with health verification and optional security scan

inputs:
  image_tar:
    description: Path to container image tar file
    required: true
  container_name:
    description: Name for running container
    required: true
  enable_security_scan:
    description: Run Grype security scan
    required: false
    default: 'true'
  pre_test_script:
    description: Shell script to run before starting the container (e.g., start dependencies, create config files)
    required: false
    default: ''
  docker_run_args:
    description: Extra flags for docker run (e.g., env vars, volumes, networks)
    required: false
    default: ''
  health_check_url:
    description: HTTP URL to curl for health verification (if empty, falls back to docker ps check)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Load container image
      env:
        IMAGE_TAR: ${{ inputs.image_tar }}
      shell: bash
      run: |
        gunzip -c ${IMAGE_TAR} | docker load
        docker image ls -a

    - name: Run pre-test setup
      # zizmor: ignore[template-injection] pre_test_script is shell by design
      if: ${{ inputs.pre_test_script != '' }}
      shell: bash
      run: |
        echo "Running pre-test setup script..."
        ${{ inputs.pre_test_script }}

    - name: Basic container functionality test
      # zizmor: ignore[template-injection] docker_run_args is shell by design
      env:
        CONTAINER_NAME: ${{ inputs.container_name }}
        HEALTH_CHECK_URL: ${{ inputs.health_check_url }}
      shell: bash
      run: |
        echo "Running basic container test for ${CONTAINER_NAME}"
        docker run -d --name test-container ${{ inputs.docker_run_args }} ${CONTAINER_NAME}:test
        sleep 10

        if [ -n "${HEALTH_CHECK_URL}" ]; then
          # HTTP health check
          echo "Checking health endpoint: ${HEALTH_CHECK_URL}"
          for i in $(seq 1 30); do
            if curl -sf "${HEALTH_CHECK_URL}" > /dev/null 2>&1; then
              echo "✅ Health check passed"
              curl -s "${HEALTH_CHECK_URL}"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Health check failed after 30 attempts"
              docker logs test-container
              docker stop test-container || true
              docker rm test-container || true
              exit 1
            fi
            echo "Waiting for health endpoint... (attempt $i/30)"
            sleep 2
          done
        else
          # Basic health check - verify container is still running
          if docker ps | grep -q test-container; then
            echo "✅ Container is running"
          else
            echo "❌ Container failed to start"
            docker logs test-container
            exit 1
          fi
        fi

        docker stop test-container
        docker rm test-container

    - name: Cleanup pre-test resources
      if: ${{ always() && inputs.pre_test_script != '' }}
      shell: bash
      run: |
        echo "Cleaning up pre-test resources..."
        docker stop test-postgres 2>/dev/null || true
        docker rm test-postgres 2>/dev/null || true
        docker network rm test-net 2>/dev/null || true

    - name: Container security scan
      if: ${{ inputs.enable_security_scan == 'true' }}
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
      with:
        image: "${{ inputs.container_name }}:test"
        output-format: "table"
        fail-build: "false"
        only-fixed: "true"
