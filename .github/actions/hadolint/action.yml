name: Hadolint
description: >-
  Lint a Dockerfile with a pinned hadolint release. Only error-level findings
  fail the step; warnings and info are printed. A .hadolint.yaml in the
  working directory is picked up as usual.

inputs:
  dockerfile:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'

runs:
  using: composite
  steps:
    # run-hadolint.sh holds the pin and the checksum check; the Forgejo twin
    # (buildah-build.yml in forgejo-shared-workflows) runs the same script.
    - name: Run hadolint
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: ${{ github.action_path }}/run-hadolint.sh "$DOCKERFILE"
