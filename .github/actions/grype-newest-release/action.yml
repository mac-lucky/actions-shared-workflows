name: Grype Newest-Release Waivers
description: >-
  Second look at a failed Grype gate: rescan the image to JSON and pass when every
  finding at or above the cutoff is on its package's newest release
  (security/grype-newest-release.sh). Fails otherwise.

inputs:
  image:
    description: Image to scan, the same value the scan step got
    required: true
  severity-cutoff:
    description: The scan step's severity-cutoff
    required: false
    default: 'high'
  only-fixed:
    description: The scan step's only-fixed
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Same pinned action and grype version as the scan step, so the binary and
    # its DB are reused from there.
    - name: Install grype
      id: grype
      uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

    # Run from the workspace like the scan step, so grype auto-loads the same
    # ./.grype.yaml.
    - name: Waive findings already on the newest release
      shell: bash
      env:
        GRYPE: ${{ steps.grype.outputs.cmd }}
        SCAN_IMAGE: ${{ inputs.image }}
        CUTOFF: ${{ inputs.severity-cutoff }}
        ONLY_FIXED: ${{ inputs.only-fixed }}
        SCRIPT: ${{ github.action_path }}/../../../security/grype-newest-release.sh
      run: |
        args=(-o json)
        [ "$ONLY_FIXED" = true ] && args+=(--only-fixed)
        "$GRYPE" "$SCAN_IMAGE" "${args[@]}" > "$RUNNER_TEMP/grype-report.json"
        bash "$SCRIPT" "$RUNNER_TEMP/grype-report.json" "$CUTOFF"
