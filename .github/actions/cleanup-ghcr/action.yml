name: Cleanup GHCR
description: Delete untagged GHCR versions not referenced by any tagged manifest list

inputs:
  registry_image:
    description: Full GHCR image URL (e.g., ghcr.io/owner/image-name)
    required: true
  github_token:
    description: >-
      Classic PAT with the delete:packages scope. Fine-grained tokens and
      github.token cannot delete package versions.
    required: true
  grace_hours:
    description: >-
      Skip untagged versions younger than this many hours. A multi-arch publish
      pushes its per-arch children untagged and only tags the manifest list once
      every arch is done, so a cleanup landing mid-build would see live children
      as orphans.
    required: false
    default: '6'
  dry_run:
    description: Log what would be deleted without deleting anything
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cleanup untagged versions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        GRACE_HOURS: ${{ inputs.grace_hours }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: bash "$GITHUB_ACTION_PATH/cleanup.sh"
