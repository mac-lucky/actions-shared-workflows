name: Check Code Changes
description: Check if code files have changed to determine if build is needed

inputs:
  file_patterns:
    description: Regex pattern for language-specific files to check (e.g., '\.(go|mod|sum)$|Dockerfile|^(src|cmd)/')
    required: true
  event_name:
    description: GitHub event name
    required: true
  detect_workflow_changes:
    description: Also detect workflow file changes
    required: false
    default: 'false'

outputs:
  code-changed:
    description: Whether code changes were detected
    value: ${{ steps.changes.outputs.code }}
  workflow-changed:
    description: Whether workflow files changed (only if detect_workflow_changes is true)
    value: ${{ steps.changes.outputs.workflow }}

runs:
  using: composite
  steps:
    - name: Check for code changes
      id: changes
      env:
        BEFORE_SHA: ${{ github.event.before }}
        DETECT_WORKFLOW_CHANGES: ${{ inputs.detect_workflow_changes }}
        EVENT_NAME: ${{ inputs.event_name }}
        FILE_PATTERNS: ${{ inputs.file_patterns }}
      shell: bash
      run: |
        if [ "${EVENT_NAME}" = "release" ]; then
          echo "Release event - forcing build"
          echo "code=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # For workflow_dispatch, always build
        if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
          echo "Manual workflow dispatch - forcing build"
          echo "code=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Tag pushes are releases - always build, regardless of the tagged commit's
        # own diff (a release can point at a docs/CI-only tip commit).
        if [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          echo "Tag push - forcing build"
          echo "code=true" >> $GITHUB_OUTPUT
          echo "workflow=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # For push events, check if there are changes to code files
        if [ "${EVENT_NAME}" = "push" ]; then
          # Diff the whole push, not just its tip: a push whose last commit is
          # docs-only still carries the code changes of the commits before it.
          # The checkout is shallow, so the pre-push commit is fetched on its
          # own. A new branch (all-zero before) or a before that cannot be
          # fetched (force-pushed away, or a private repo: the checkout keeps no
          # credentials) falls back to the tip commit's parent.
          DIFF_BASE=""
          if [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] && ! [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
              || git fetch --quiet --no-tags --depth=1 origin "${BEFORE_SHA}" 2>/dev/null; then
              DIFF_BASE="${BEFORE_SHA}"
            else
              echo "Could not fetch the pre-push commit ${BEFORE_SHA}; diffing against HEAD~1"
            fi
          fi
          if [ -z "${DIFF_BASE}" ] && git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_BASE="HEAD~1"
          fi
          if [ -n "${DIFF_BASE}" ]; then
            # Check for changes in language-specific files
            CHANGED_FILES=$(git diff --name-only "${DIFF_BASE}" HEAD)

            # Look for changes matching the file pattern
            if echo "$CHANGED_FILES" | grep -E "${FILE_PATTERNS}" > /dev/null; then
              echo "Code changes detected:"
              echo "$CHANGED_FILES" | grep -E "${FILE_PATTERNS}"
              echo "code=true" >> $GITHUB_OUTPUT
            else
              echo "No code changes detected. Only documentation/config changes:"
              echo "$CHANGED_FILES"
              echo "code=false" >> $GITHUB_OUTPUT
            fi

            # Check for workflow changes if requested
            if [ "${DETECT_WORKFLOW_CHANGES}" = "true" ]; then
              if echo "$CHANGED_FILES" | grep -E '\.github/workflows/' > /dev/null; then
                echo "Workflow changes detected"
                echo "workflow=true" >> $GITHUB_OUTPUT
              else
                echo "workflow=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "First commit - forcing build"
            echo "code=true" >> $GITHUB_OUTPUT
          fi
        else
          # For PR events, always run tests but don't push
          echo "Pull request - running tests only"
          echo "code=false" >> $GITHUB_OUTPUT
        fi
