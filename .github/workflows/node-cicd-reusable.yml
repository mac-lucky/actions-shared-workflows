---
name: Reusable Node.js CI/CD Workflow

on:
  workflow_call:
    secrets:
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKER_HUB_PASSWORD:
        description: 'Docker Hub password/token'
        required: false
    inputs:
      # Application configuration
      app_name:
        description: 'Application name'
        required: true
        type: string
      dockerhub_image:
        description: 'Docker Hub image name (e.g., maclucky/app-name)'
        required: true
        type: string
      ghcr_image:
        description: 'GHCR image name (e.g., ghcr.io/mac-lucky/app-name)'
        required: true
        type: string

      # Build configuration
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version (fallback if not detected from Dockerfile)'
        required: false
        type: string
        default: '22'
      package_manager:
        description: 'Package manager to use (bun or npm)'
        required: false
        type: string
        default: 'bun'

      # Test configuration
      enable_container_tests:
        description: 'Enable container integration tests'
        required: false
        type: boolean
        default: true
      container_test_pre_script:
        description: 'Shell script to run before the container test (e.g., start dependencies)'
        required: false
        type: string
        default: ''
      container_test_run_args:
        description: 'Extra flags for docker run in container test (e.g., env vars, volumes, networks)'
        required: false
        type: string
        default: ''
      container_test_health_url:
        description: 'HTTP URL to curl for container health verification'
        required: false
        type: string
        default: ''

      # Security and quality
      enable_security_scan:
        description: 'Enable security scanning with Grype'
        required: false
        type: boolean
        default: true
      enable_sbom:
        description: 'Generate Software Bill of Materials'
        required: false
        type: boolean
        default: true
      scan_severity_cutoff:
        description: 'Grype severity at/above which findings count (negligible|low|medium|high|critical)'
        required: false
        type: string
        default: 'high'
      scan_only_fixed:
        description: 'Only gate on vulnerabilities that have a fix available'
        required: false
        type: boolean
        default: true
      scan_fail_build:
        description: 'Fail the build (block the push) when the image scan finds gating vulnerabilities'
        required: false
        type: boolean
        default: true
      enable_code_analysis:
        description: 'Enable code analysis (svelte-check, build verification, grype)'
        required: false
        type: boolean
        default: true
      enable_build_check:
        description: 'Run the build verification leg of code analysis. Disable when the Docker build already runs the same build command as a hard gate.'
        required: false
        type: boolean
        default: true

      # Deployment. Tag pushes (vX.Y.Z) always publish: the image is tagged
      # with the version plus latest, and a GitHub Release with generated notes
      # is created.
      enable_auto_version:
        description: '(deprecated, ignored) publishing is tag-gated; versions come from the git tag'
        required: false
        type: boolean
        default: true
      push_on_main:
        description: '(deprecated, ignored) main pushes only build and test'
        required: false
        type: boolean
        default: true
      push_on_tag:
        description: '(deprecated, ignored) tag pushes always publish now'
        required: false
        type: boolean
        default: false
      release_notes_path_filter:
        description: 'Limit release-note commits to this path; empty includes all commits'
        required: false
        type: string
        default: ''
      push_to_dockerhub:
        description: 'Push images to Docker Hub (in addition to GHCR)'
        required: false
        type: boolean
        default: false
      main_branch:
        description: 'Main branch name used for push gating (e.g., main or master)'
        required: false
        type: string
        default: 'main'

      # Runner configuration
      runner_default:
        description: 'Default runner for CI jobs (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      runner_amd64:
        description: 'Runner for amd64 builds (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      runner_arm64:
        description: 'Runner for arm64 builds (e.g., ubuntu-24.04-arm or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-24.04-arm'
      skip_qemu_setup:
        description: 'Skip QEMU setup. Defaults to true because the arm64 legs run on native arm runners; set false only when runner_arm64 is an amd64 machine that emulates.'
        required: false
        type: boolean
        default: true
      build_fetch_depth:
        description: >-
          Checkout depth for the container build and publish jobs. Defaults to a
          shallow clone; set to 0 when the Docker build reads git history (e.g. to
          derive per-file commit dates). Full history is slower to fetch and sends
          .git into the build context, so only opt in where it is needed.
        required: false
        type: number
        default: 1

env:
  REGISTRY_IMAGE_DOCKERHUB: ${{ inputs.dockerhub_image }}
  REGISTRY_IMAGE_GHCR: ${{ inputs.ghcr_image }}

jobs:
  # Job 1: Check for code changes
  check-changes:
    name: Check for Code Changes
    runs-on: ${{ inputs.runner_default }}
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The change check diffs the tip commit against its parent only.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        uses: mac-lucky/actions-shared-workflows/.github/actions/check-code-changes@master
        with:
          file_patterns: '\.(ts|js|svelte|css|html)$|package\.json|bun\.lock|Dockerfile|^src/|^messages/|^project\.inlang/|^static/|^nginx/|^scripts/'
          event_name: ${{ github.event_name }}
          detect_workflow_changes: 'true'

  # Job 2: Setup Build Environment
  setup:
    name: Setup Build Environment
    runs-on: ${{ inputs.runner_default }}
    needs: check-changes
    outputs:
      node-version: ${{ steps.node-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract Node version
        id: node-version
        run: |
          NODE_VERSION=""

          # Try to extract from Dockerfile first (e.g., FROM node:22-alpine)
          if [ -f "${{ inputs.dockerfile_path }}" ]; then
            NODE_VERSION=$(grep -E '^FROM.*node:' ${{ inputs.dockerfile_path }} | head -1 | sed -E 's/.*node:([0-9]+).*/\1/')
          fi

          # Fallback to input default
          if [ -z "$NODE_VERSION" ]; then
            NODE_VERSION="${{ inputs.node_version }}"
          fi

          echo "Found Node version: $NODE_VERSION"
          echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT

  # Job 3: Code Quality & Security Analysis (parallel matrix)
  code-analysis:
    name: Code Analysis (${{ matrix.tool }})
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup]
    if: ${{ inputs.enable_code_analysis && (github.event_name != 'push' || needs.check-changes.outputs.code-changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.enable_build_check && '["svelte-check", "build-check"]' || '["svelte-check"]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        if: ${{ matrix.tool != 'grype' && inputs.package_manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Set up Node.js
        if: ${{ matrix.tool != 'grype' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          # setup-node has no cache default, so npm ci re-downloaded every
          # dependency on every leg. Empty string keeps caching off for the bun
          # path, which caches ~/.bun/install/cache below instead.
          cache: ${{ inputs.package_manager == 'npm' && 'npm' || '' }}

      # setup-bun caches only the bun binary, not what bun install fetches.
      - name: Cache bun downloads
        if: ${{ matrix.tool != 'grype' && inputs.package_manager == 'bun' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ matrix.tool != 'grype' }}
        working-directory: ${{ inputs.build_context }}
        run: |
          if [ "${{ inputs.package_manager }}" = "bun" ]; then
            bun install --frozen-lockfile 2>/dev/null || bun install
          else
            npm ci 2>/dev/null || npm install
          fi

      - name: Run svelte-check
        if: matrix.tool == 'svelte-check'
        working-directory: ${{ inputs.build_context }}
        run: |
          if OUTPUT=$(npx svelte-check --tsconfig ./tsconfig.json 2>&1); then
            echo "## :white_check_mark: Svelte Check" >> $GITHUB_STEP_SUMMARY
            echo "No issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Svelte Check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run build check
        if: matrix.tool == 'build-check'
        working-directory: ${{ inputs.build_context }}
        run: |
          if [ "${{ inputs.package_manager }}" = "bun" ]; then
            BUILD_CMD="bun run build"
          else
            BUILD_CMD="npm run build"
          fi

          if OUTPUT=$($BUILD_CMD 2>&1); then
            echo "## :white_check_mark: Build Check" >> $GITHUB_STEP_SUMMARY
            echo "Build completed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Build Check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # Job 4: Build Container Image
  build-container:
    name: Build Container Image
    runs-on: ${{ inputs.runner_default }}
    # Runs in parallel with code-analysis: the image build takes no input from
    # it, and the publish gate on its result lives in the build job below. An
    # analysis failure still reds the run through all-checks.
    needs: [check-changes, setup]
    if: ${{ github.event_name != 'push' || needs.check-changes.outputs.code-changed == 'true' }}
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.build_fetch_depth }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build container
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.app_name }}:test
          # Same scope as the tag build's amd64 leg: a tag run can only restore
          # caches written on its own ref or the default branch, so writing the
          # default "buildkit" scope here left every release build cold.
          cache-from: type=gha,scope=build-linux-amd64
          # PRs write mode=min: a PR cache is only restorable by re-runs of the
          # same PR, and a full mode=max export per PR crowds the repo's 10 GB
          # cache budget and evicts the branch caches releases restore from.
          cache-to: type=gha,scope=build-linux-amd64,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}
          push: false
          load: true

      - name: Save container image
        if: ${{ inputs.enable_container_tests }}
        run: |
          docker save ${{ inputs.app_name }}:test | \
            gzip > /tmp/${{ inputs.app_name }}.tar.gz

      - name: Upload container artifact
        if: ${{ inputs.enable_container_tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-image
          path: /tmp/${{ inputs.app_name }}.tar.gz
          retention-days: 1

  # Job 4b: Warm the arm64 layer cache from the default branch. The tag build's
  # arm64 leg restores scope build-linux-arm64, and a tag run can only read
  # caches written on its own ref or the default branch - without this job every
  # release built arm64 from scratch. Deliberately outside the release path and
  # absent from all-checks: a hiccup here costs one cold build, never a red run.
  warm-arm64:
    name: Warm arm64 Build Cache
    runs-on: ${{ inputs.runner_arm64 }}
    needs: [check-changes, setup]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.check-changes.outputs.code-changed == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.build_fetch_depth }}

      - name: Set up QEMU
        if: ${{ !inputs.skip_qemu_setup }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build arm64 image for cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          tags: ${{ inputs.app_name }}:warm-arm64
          cache-from: type=gha,scope=build-linux-arm64
          cache-to: type=gha,scope=build-linux-arm64,mode=max
          push: false
          build-args: |
            NODE_VERSION=${{ needs.setup.outputs.node-version }}

  # Job 5: Container Integration Tests
  container-test:
    name: Container Integration Test
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, build-container]
    if: ${{ inputs.enable_container_tests && needs.build-container.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download container artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-image
          path: /tmp

      - name: Container health check
        uses: mac-lucky/actions-shared-workflows/.github/actions/container-healthcheck@master
        with:
          image_tar: /tmp/${{ inputs.app_name }}.tar.gz
          container_name: ${{ inputs.app_name }}
          enable_security_scan: ${{ inputs.enable_security_scan }}
          pre_test_script: ${{ inputs.container_test_pre_script }}
          docker_run_args: ${{ inputs.container_test_run_args }}
          health_check_url: ${{ inputs.container_test_health_url }}

  # Job 6: Build platform-specific images in parallel
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [check-changes, setup, code-analysis, build-container, container-test]
    # always() switches off the implicit "skip when a dependency failed" rule, so
    # every gate has to be checked explicitly or a failed job still publishes.
    # code-analysis is gated here (not via build-container, which runs in
    # parallel with it); skipped passes because the matrix is opt-out and
    # event-gated. Publishing is tag-gated.
    if: ${{ always() && needs.build-container.result == 'success' && (needs.code-analysis.result == 'success' || needs.code-analysis.result == 'skipped') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (inputs.enable_container_tests == false || needs.container-test.result == 'success' || needs.container-test.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      security-events: write
      # codeql-action/upload-sarif reads the workflow run to fingerprint SARIF;
      # on private repos that needs actions:read or it 403s ("Resource not
      # accessible by integration") and fails the job, skipping the publish.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.runner_amd64 }}
          - platform: linux/arm64
            runner: ${{ inputs.runner_arm64 }}
    outputs:
      new-version: ${{ steps.set_version.outputs.new_version }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ inputs.build_fetch_depth }}

      - name: Set up QEMU
        if: ${{ !inputs.skip_qemu_setup }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set version
        id: set_version
        run: |
          # Tag-driven release: the version is the tag itself, minus a leading v.
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          # NEW_VERSION is interpolated into later shell steps (the merge job), and
          # it derives from a ref name any writer can craft, so reject anything
          # that is not a bare semver before it can reach a shell.
          if ! printf '%s' "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to build: version '$NEW_VERSION' is not a bare semver (ref: ${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build this single arch into the local daemon so it can be scanned before push
      # (single-platform builds support load:true; multi-platform ones do not). Warms
      # the gha cache (mode=max) for the push build below.
      - name: Build image for scan
        id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ needs.setup.outputs.node-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          load: true
          push: false
          tags: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      # Scan the built image; with fail-build:true a gating finding fails the job so the
      # push step never runs and merge (needs: build) is skipped - nothing is published.
      - name: Container security scan (Grype)
        id: scan
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          severity-cutoff: ${{ inputs.scan_severity_cutoff }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          fail-build: ${{ inputs.scan_fail_build }}

      - name: Upload scan SARIF
        # Reporting only - a SARIF upload failure must never block publishing the image.
        continue-on-error: true
        if: ${{ inputs.enable_security_scan && always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ env.PLATFORM_PAIR }}

      # Cache hit from the scan build above; only exports/pushes layers by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ needs.setup.outputs.node-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_GHCR }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Job 7: Merge platform-specific images into multi-arch manifest
  merge:
    name: Create Multi-arch Manifest
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Prepare version
        run: |
          echo "NEW_VERSION=${{ needs.build.outputs.new-version }}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push (GHCR)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Create manifest list and push (Docker Hub)
        if: ${{ inputs.push_to_dockerhub }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          LATEST=""
          case "${{ env.NEW_VERSION }}" in
            *-*) ;;  # prerelease never moves latest, matching the GHCR tag set
            *) LATEST="-t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:latest" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:${{ env.NEW_VERSION }} \
            $LATEST \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}

      - name: Generate SBOM
        if: ${{ inputs.enable_sbom }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  # Job 8: Post-deployment verification
  post-deploy-verify:
    name: Post-deployment Verification
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Verify deployed image
        uses: mac-lucky/actions-shared-workflows/.github/actions/verify-deployed-image@master
        with:
          registry_image: ${{ env.REGISTRY_IMAGE_GHCR }}
          github_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.new-version }}

  # Job 9: GitHub Release with generated notes
  # No permissions block on purpose: it inherits the caller job's grant, which
  # must include contents:write for tag runs. Declaring it here would instead
  # compile-fail every caller that grants less on every event.
  release:
    name: GitHub Release
    runs-on: ${{ inputs.runner_default }}
    needs: [build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}
          path_filter: ${{ inputs.release_notes_path_filter }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=""
          if [ -f sbom.spdx.json ]; then
            ASSETS="sbom.spdx.json"
          fi
          # Idempotent: re-running a tag workflow (a normal recovery path) must
          # refresh the release, not die on "already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            if [ -n "$ASSETS" ]; then
              # shellcheck disable=SC2086
              gh release upload "${GITHUB_REF_NAME}" $ASSETS --clobber
            fi
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              $ASSETS
          fi

  # Job 10: the single status check a branch ruleset should require.
  # Every other job name here ends in a matrix expansion, so a ruleset naming
  # them directly breaks whenever a platform or analysis tool is added or
  # renamed. This name is fixed, so callers only ever have to require
  # "<caller job id> / All checks passed".
  # No permissions block on purpose, for the same reason as the release job.
  all-checks:
    name: All checks passed
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, code-analysis, build-container, container-test, build, merge, post-deploy-verify, release]
    if: ${{ always() }}
    steps:
      # skipped counts as a pass: most jobs here are gated on event type or on
      # an opt-in input, so a PR run legitimately skips much of the workflow
      # and must still report green.
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more jobs failed or were cancelled"
          exit 1
