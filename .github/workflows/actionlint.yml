---
name: Lint Workflows

# Self-check for this repo. A syntax error that lands on master breaks CI in
# every caller at once, so workflow and action changes get linted before merge.

on:
  push:
    branches: [master]
    paths: ['.github/**', 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache actionlint
        id: cache-actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ./actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Download actionlint
        if: ${{ steps.cache-actionlint.outputs.cache-hit != 'true' }}
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      # actionlint runs shellcheck on every run: block itself; reusable
      # workflows use workflow_call inputs actionlint understands natively.
      # SC2086/SC2046/SC2129 are quoting and style advisories that the existing
      # scripts trip all over (unquoted $GITHUB_OUTPUT, intentional word
      # splitting for imagetools args); the gate is for real errors.
      - name: Run actionlint
        run: ./actionlint -color -ignore 'SC2086' -ignore 'SC2046' -ignore 'SC2129'

  shellcheck:
    name: shellcheck action scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Composite actions that keep their logic in a standalone script (rather
      # than inline in action.yml) get that script checked here, and so do the
      # security/ scripts the reusables and the Forgejo side run, and scripts/.
      - name: Shellcheck scripts
        run: |
          shopt -s globstar nullglob
          files=(.github/actions/**/*.sh security/*.sh scripts/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No scripts to check"
            exit 0
          fi
          # -S warning: info-level advisories (e.g. SC2153 on env-provided
          # variables) do not fail the gate.
          shellcheck -S warning "${files[@]}"

  # Workflow security lint (template injection, credential persistence,
  # excessive permissions, unpinned actions). Offline: the online audits
  # would look up every action ref on the GitHub API. The policy lives in
  # .github/zizmor.yml; an intended finding carries an inline
  # `# zizmor: ignore[...]` comment with its reason.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.30.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --no-progress .
