---
name: Reusable Auto Tag Workflow

# Creates the release tag the CI/CD reusables publish from. Callers run this on
# pushes to their default branch (usually with a paths: filter); the tag push
# then triggers the caller's own release build. Refs pushed with github.token
# do not trigger workflows, so the tag is pushed with a GitHub App installation
# token (CI_APP_CLIENT_ID + CI_APP_PRIVATE_KEY) or, for a caller without the
# App, a PAT (TAG_PUSH_TOKEN). The App wins when both are set.

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          upstream-arg: tag v<value> of a Dockerfile ARG, or v<value>-rN when
          that tag already exists (rebuild of the same upstream version).
          patch: bump the patch component of the newest v* tag (v0.1.0 when no
          tag exists yet).
        required: true
        type: string
      arg_name:
        description: 'Dockerfile ARG holding the upstream version (upstream-arg mode)'
        required: false
        type: string
        default: ''
      dockerfile_path:
        description: 'Dockerfile read in upstream-arg mode'
        required: false
        type: string
        default: './Dockerfile'
      tag_prefix:
        description: >-
          Prefix of the tags this caller cuts, for a monorepo that versions
          each image on its own (pushward-integrations: `github/`). patch mode
          then bumps the newest `<prefix>v*` tag and cuts `<prefix>v0.1.0`
          when there is none; upstream-arg tags `<prefix>v<value>`. Lowercase
          letters, digits and dashes, ending in a slash.
        required: false
        type: string
        default: ''
    secrets:
      CI_APP_CLIENT_ID:
        description: 'Client ID of a GitHub App installed on the caller with Contents and Workflows read and write'
        required: false
      CI_APP_PRIVATE_KEY:
        description: 'Private key (PEM) of that App'
        required: false
      TAG_PUSH_TOKEN:
        description: 'PAT with repo scope, used when the App secrets are not set'
        required: false

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # An unset caller secret arrives as an empty string and would fail
      # inside checkout with an unhelpful message; fail first with one that
      # says what to set.
      - name: Pick the push credential
        id: credential
        env:
          APP_ID: ${{ secrets.CI_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
          TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "Pushing with a GitHub App installation token"
            echo "use=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_ID" ] || [ -n "$APP_KEY" ]; then
            echo "::error::CI_APP_CLIENT_ID and CI_APP_PRIVATE_KEY go together, and one of them is empty in this repository"
            exit 1
          elif [ -n "$TOKEN" ]; then
            echo "Pushing with TAG_PUSH_TOKEN"
            echo "use=pat" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no push credential - add CI_APP_CLIENT_ID and CI_APP_PRIVATE_KEY (a GitHub App installed on this repository) or TAG_PUSH_TOKEN (a repo-scoped PAT) as Actions secrets in this repository"
            exit 1
          fi

      - name: App token
        id: app
        if: steps.credential.outputs.use == 'app'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          # GitHub can refuse an App's tag push over the workflow files the
          # tagged commit carries (say, master moved on with a workflow change)
          # unless the token may write workflows.
          permission-workflows: write

      - name: Checkout code
        # zizmor: ignore[artipacked] the tag push below authenticates with this persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.TAG_PUSH_TOKEN }}

      - name: Compute and push tag
        env:
          MODE: ${{ inputs.mode }}
          ARG_NAME: ${{ inputs.arg_name }}
          DOCKERFILE: ${{ inputs.dockerfile_path }}
          PREFIX: ${{ inputs.tag_prefix }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # The prefix goes into a grep pattern and a ref name below, so only
          # characters that mean nothing to either get through.
          if [ -n "$PREFIX" ] && ! [[ "$PREFIX" =~ ^[a-z0-9][a-z0-9-]*/$ ]]; then
            echo "tag_prefix '$PREFIX' must be lowercase letters, digits and dashes ending in a slash"
            exit 1
          fi
          # docker-cicd's "Compute version from tag" regex (2-4 dotted numerics,
          # an optional suffix): every upstream-arg caller builds with it, and a
          # tag it refuses would sit live with no release behind it.
          is_version() { [[ "$1" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?$ ]]; }
          # Sets TAG from the tags in this clone, or exits when there is nothing
          # to tag. Runs a second time after a rejected push.
          compute_tag() {
            # A commit that a release tag of this prefix already contains (a minor
            # or major cut by hand, pushed with or before the branch, or a newer
            # commit's run that tagged first) is released: another tag would
            # publish the same or older code again and move latest back to it.
            # Only v<version> and v<version>-rN count, so a test tag such as
            # v0.0.0-test releases nothing. A dispatch is a rebuild request
            # (scan-ghcr's, or by hand), so it tags anyway.
            TAGGED=$(git tag --contains HEAD --list "${PREFIX}v*" | grep -E "^${PREFIX}v[0-9]+(\.[0-9]+){1,3}(-r[0-9]+)?$" | head -n1 || true)
            if [ -n "$TAGGED" ] && [ "$EVENT" != "workflow_dispatch" ]; then
              echo "HEAD is already released by ${TAGGED}; nothing to do"
              exit 0
            fi
            case "$MODE" in
              upstream-arg)
                if [ -z "$ARG_NAME" ]; then
                  echo "arg_name is required in upstream-arg mode"
                  exit 1
                fi
                RAW=$(grep -oE "^ARG ${ARG_NAME}=\"?[^\" ]+" "$DOCKERFILE" | head -n1 | cut -d= -f2 | tr -d '"' || true)
                if [ -z "$RAW" ]; then
                  echo "ARG ${ARG_NAME} not found in ${DOCKERFILE}"
                  exit 1
                fi
                VALUE="${RAW#v}"
                if ! is_version "$VALUE"; then
                  echo "::error::ARG ${ARG_NAME}=${RAW} in ${DOCKERFILE} is not a version docker-cicd builds"
                  exit 1
                fi
                BASE="${PREFIX}v${VALUE}"
                if ! git rev-parse -q --verify "refs/tags/${BASE}" > /dev/null; then
                  TAG="$BASE"
                else
                  # Same upstream version rebuilt (base image bump, Dockerfile
                  # fix): count up a -rN suffix. Only <base>-r<digits> counts;
                  # the glob also lists a <base>-rc1, which must never reach the
                  # arithmetic below.
                  BASE_RE=$(printf '%s' "$BASE" | sed 's/\./\\./g')
                  N=$(git tag --list "${BASE}-r*" | sed -nE "s|^${BASE_RE}-r([0-9]+)$|\1|p" | sort -n | tail -n1)
                  TAG="${BASE}-r$(( ${N:-0} + 1 ))"
                  if ! is_version "${TAG#"${PREFIX}"v}"; then
                    echo "::error::rebuild tag ${TAG} is not a version docker-cicd builds (a suffixed upstream version cannot take -rN)"
                    exit 1
                  fi
                fi
                ;;
              patch)
                LAST=$(git tag --list "${PREFIX}v*" | grep -E "^${PREFIX}v[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -n1 || true)
                if [ -z "$LAST" ]; then
                  TAG="${PREFIX}v0.1.0"
                else
                  LAST="${LAST#"$PREFIX"}"
                  TAG="${PREFIX}$(echo "${LAST#v}" | awk -F. -v OFS=. '{$3++; print "v"$0}')"
                fi
                ;;
              *)
                echo "Unknown mode: $MODE"
                exit 1
                ;;
            esac
            if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
              echo "Tag ${TAG} already exists; nothing to do"
              exit 0
            fi
          }
          compute_tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          if ! git push origin "refs/tags/${TAG}"; then
            # Most often another run (a merge right behind this one, a tag cut
            # by hand) pushed a tag first: drop ours, take the remote tags into
            # account and try once more. A push refused for any other reason
            # fails again below.
            echo "Push of ${TAG} was rejected; fetching tags and computing again"
            ORIG="$TAG"
            git tag -d "$TAG" > /dev/null
            git fetch --quiet --force --tags origin
            # The push can land and still report an error. The tag is then on
            # the remote at HEAD, and a dispatch, which skips compute_tag's
            # release check, would tag the same commit a second time.
            if [ "$(git rev-parse -q --verify "refs/tags/${ORIG}^{commit}" || true)" = "$(git rev-parse HEAD)" ]; then
              echo "Pushed ${ORIG}"
              exit 0
            fi
            compute_tag
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/${TAG}"
          fi
          echo "Pushed ${TAG}"
