---
name: Reusable Python CI/CD Workflow

on:
  workflow_call:
    secrets:
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKER_HUB_PASSWORD:
        description: 'Docker Hub password/token'
        required: false
    inputs:
      # Application configuration
      app_name:
        description: 'Application name'
        required: true
        type: string
      dockerhub_image:
        description: 'Docker Hub image name (e.g., maclucky/app-name)'
        required: true
        type: string
      ghcr_image:
        description: 'GHCR image name (e.g., ghcr.io/mac-lucky/app-name)'
        required: true
        type: string

      # Build configuration
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'

      # Package manager configuration
      use_uv:
        description: 'Use uv package manager instead of pip'
        required: false
        type: boolean
        default: true
      python_version:
        description: 'Python version to use (if not auto-detected from Dockerfile)'
        required: false
        type: string
        default: '3.12'

      # Test configuration
      # Off by default: callers without a test suite would otherwise fail on
      # pytest's exit code 5 (no tests collected).
      enable_unit_tests:
        description: 'Run the unit test suite before building the image'
        required: false
        type: boolean
        default: false
      pytest_args:
        description: 'Extra arguments for pytest (e.g., -q -k "not slow")'
        required: false
        type: string
        default: ''
      enable_container_tests:
        description: 'Enable container integration tests'
        required: false
        type: boolean
        default: true
      enable_kubernetes_tests:
        description: 'Enable Kubernetes integration tests'
        required: false
        type: boolean
        default: false
      helm_chart_path:
        description: 'Path to Helm chart for Kubernetes tests'
        required: false
        type: string
        default: ''
      helm_release_name:
        description: 'Helm release name for deployment'
        required: false
        type: string
        default: ''
      app_label_selector:
        description: 'App label selector for Kubernetes pods (e.g., ping-exporter, tcp-endpoint-check-exporter)'
        required: false
        type: string
        default: ''
      enable_custom_metrics_test:
        description: 'Enable custom metrics endpoint test with port-forward'
        required: false
        type: boolean
        default: false
      metrics_port:
        description: 'Port for metrics endpoint (e.g., 9107)'
        required: false
        type: string
        default: ''
      metrics_test_pattern:
        description: 'Pattern to search for in metrics output (e.g., ping_loss_ratio)'
        required: false
        type: string
        default: ''

      # Security and quality
      enable_security_scan:
        description: 'Enable security scanning with Grype'
        required: false
        type: boolean
        default: true
      enable_sbom:
        description: 'Generate Software Bill of Materials'
        required: false
        type: boolean
        default: true
      scan_severity_cutoff:
        description: 'Grype severity at/above which findings count (negligible|low|medium|high|critical)'
        required: false
        type: string
        default: 'high'
      scan_only_fixed:
        description: 'Only gate on vulnerabilities that have a fix available'
        required: false
        type: boolean
        default: true
      scan_fail_build:
        description: 'Fail the build (block the push) when the image scan finds gating vulnerabilities'
        required: false
        type: boolean
        default: true
      enable_code_analysis:
        description: 'Enable code analysis (linting, formatting checks)'
        required: false
        type: boolean
        default: true
      # Ruff gates the build, so its version decides what "clean" means, and its
      # default rule set grows between releases (0.16 enables 413). Callers with no
      # [tool.ruff.lint] select inherit that, so floating it would red them all.
      ruff_version:
        description: 'Ruff version to lint and format-check with'
        required: false
        type: string
        default: '0.16.1'
      bandit_version:
        description: 'Bandit version for the advisory security scan'
        required: false
        type: string
        default: '1.9.4'

      # Deployment. Tag pushes (vX.Y.Z) always publish: the image is tagged
      # with the version plus latest, and a GitHub Release with generated notes
      # is created.
      enable_auto_version:
        description: '(deprecated, ignored) publishing is tag-gated; versions come from the git tag'
        required: false
        type: boolean
        default: true
      push_on_main:
        description: '(deprecated, ignored) main pushes only build and test'
        required: false
        type: boolean
        default: true
      release_notes_path_filter:
        description: 'Limit release-note commits to this path; empty includes all commits'
        required: false
        type: string
        default: ''
      push_to_dockerhub:
        description: 'Push images to Docker Hub (in addition to GHCR)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_IMAGE_DOCKERHUB: ${{ inputs.dockerhub_image }}
  REGISTRY_IMAGE_GHCR: ${{ inputs.ghcr_image }}

jobs:
  # Job 1: Check for code changes
  check-changes:
    name: Check for Code Changes
    runs-on: ubuntu-latest
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The change check diffs the tip commit against its parent only.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        uses: mac-lucky/actions-shared-workflows/.github/actions/check-code-changes@master
        with:
          file_patterns: '\.(py|toml|lock)$|Dockerfile|^(src|app|python)/'
          event_name: ${{ github.event_name }}
          detect_workflow_changes: 'true'

  setup:
    name: Setup Build Environment
    runs-on: ubuntu-latest
    needs: check-changes
    outputs:
      python-version: ${{ steps.python-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract Python version
        id: python-version
        run: |
          # Try to extract from Dockerfile first
          if [ -f "${{ inputs.dockerfile_path }}" ]; then
            PYTHON_VERSION=$(grep -E '^FROM.*python:' ${{ inputs.dockerfile_path }} | head -1 | sed -E 's/.*python:([0-9]+\.[0-9]+).*/\1/')
          fi

          # Try .python-version file
          if [ -z "$PYTHON_VERSION" ] && [ -f "${{ inputs.build_context }}/.python-version" ]; then
            PYTHON_VERSION=$(tr -d '[:space:]' < "${{ inputs.build_context }}/.python-version")
          fi

          # Try pyproject.toml
          if [ -z "$PYTHON_VERSION" ] && [ -f "${{ inputs.build_context }}/pyproject.toml" ]; then
            PYTHON_VERSION=$(grep -E 'requires-python' "${{ inputs.build_context }}/pyproject.toml" | sed -E 's/.*>=([0-9]+\.[0-9]+).*/\1/' | head -1)
          fi

          # Fallback to input or default
          if [ -z "$PYTHON_VERSION" ]; then
            PYTHON_VERSION="${{ inputs.python_version }}"
          fi

          echo "Found Python version: $PYTHON_VERSION"
          echo "version=$PYTHON_VERSION" >> $GITHUB_OUTPUT

  # Job 3: Code Quality & Security Analysis (parallel matrix)
  code-analysis:
    name: Code Analysis (${{ matrix.tool }})
    runs-on: ubuntu-latest
    needs: [check-changes, setup]
    if: ${{ inputs.enable_code_analysis && (github.event_name != 'push' || needs.check-changes.outputs.code-changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: ruff-lint
            name: Ruff Linter
          - tool: ruff-format
            name: Ruff Formatter
          - tool: bandit
            name: Bandit Security
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        if: ${{ inputs.use_uv && (matrix.tool == 'ruff-lint' || matrix.tool == 'ruff-format' || matrix.tool == 'bandit') }}
        # setup-uv stopped publishing floating major tags after v7, so this
        # has to be an exact version.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        if: matrix.tool != 'grype'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          # Only the non-uv fallback installs through pip; setup-uv brings its
          # own cache for the default path. Empty string keeps caching off.
          cache: ${{ inputs.use_uv == false && 'pip' || '' }}

      - name: Install dependencies with uv
        if: ${{ inputs.use_uv && (matrix.tool == 'ruff-lint' || matrix.tool == 'ruff-format') }}
        working-directory: ${{ inputs.build_context }}
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync --frozen 2>/dev/null || uv sync
          else
            echo "No pyproject.toml found, skipping dependency installation"
          fi

      - name: Install ruff
        if: matrix.tool == 'ruff-lint' || matrix.tool == 'ruff-format'
        env:
          TOOL_VERSION: ${{ inputs.ruff_version }}
        run: |
          if [ "${{ inputs.use_uv }}" = "true" ]; then
            uv tool install ruff=="$TOOL_VERSION"
          else
            pip install ruff=="$TOOL_VERSION"
          fi

      # Two runs on purpose: concise reads better in the step summary, github
      # emits the inline annotations. The concise run decides the exit status,
      # so the || true below only ever swallows a duplicate failure.
      - name: Run ruff linter
        if: matrix.tool == 'ruff-lint'
        working-directory: ${{ inputs.build_context }}
        run: |
          if OUTPUT=$(ruff check . --output-format=concise 2>&1); then
            echo "## :white_check_mark: Ruff Linter" >> $GITHUB_STEP_SUMMARY
            echo "No issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Ruff Linter" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ruff check . --output-format=github || true
            exit 1
          fi

      - name: Run ruff formatter check
        if: matrix.tool == 'ruff-format'
        working-directory: ${{ inputs.build_context }}
        run: |
          if OUTPUT=$(ruff format --check . 2>&1); then
            echo "## :white_check_mark: Ruff Formatter" >> $GITHUB_STEP_SUMMARY
            echo "All files are properly formatted." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Ruff Formatter" >> $GITHUB_STEP_SUMMARY
            echo "The following files need formatting:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Advisory on purpose, unlike the ruff legs above: bandit's default rule set
      # flags every assert in a test suite (B101), so gating on it would block on
      # pytest rather than on anything a caller can act on. Read the summary.
      - name: Install and run bandit
        if: matrix.tool == 'bandit'
        working-directory: ${{ inputs.build_context }}
        env:
          TOOL_VERSION: ${{ inputs.bandit_version }}
        run: |
          if [ "${{ inputs.use_uv }}" = "true" ]; then
            uv tool install bandit=="$TOOL_VERSION"
          else
            pip install bandit=="$TOOL_VERSION"
          fi
          # Exclude paths need the ./ prefix: bandit matches them against the paths
          # -r . produces, so a bare .venv never matches and scans the whole venv.
          if OUTPUT=$(bandit -r . -f txt --exclude ./.venv,./.git 2>&1); then
            echo "## :white_check_mark: Bandit Security" >> $GITHUB_STEP_SUMMARY
            echo "No security issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :warning: Bandit Security" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # Job 3b: Python Tests (optional)
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [check-changes, setup]
    if: ${{ inputs.enable_unit_tests && (github.event_name != 'push' || needs.check-changes.outputs.code-changed == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        if: ${{ inputs.use_uv }}
        # setup-uv stopped publishing floating major tags after v7, so this
        # has to be an exact version.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ needs.setup.outputs.python-version }}
          # Only the non-uv fallback installs through pip; setup-uv brings its
          # own cache for the default path. Empty string keeps caching off.
          cache: ${{ inputs.use_uv == false && 'pip' || '' }}

      - name: Install dependencies
        working-directory: ${{ inputs.build_context }}
        run: |
          if [ "${{ inputs.use_uv }}" = "true" ]; then
            uv sync --frozen 2>/dev/null || uv sync
          else
            pip install -r requirements.txt 2>/dev/null || pip install .
          fi

      - name: Run tests
        working-directory: ${{ inputs.build_context }}
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        run: |
          set +e
          # PYTEST_ARGS is unquoted on purpose: it has to split into words.
          # shellcheck disable=SC2086
          if [ "${{ inputs.use_uv }}" = "true" ]; then
            OUTPUT=$(uv run pytest $PYTEST_ARGS 2>&1)
          else
            OUTPUT=$(pytest $PYTEST_ARGS 2>&1)
          fi
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"
          {
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "## :white_check_mark: Unit Tests"
            else
              echo "## :x: Unit Tests"
            fi
            echo '```'
            # The tail carries pytest's own summary ("41 passed in 0.24s").
            echo "$OUTPUT" | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

  # Job 4: Build Container Image
  build-container:
    name: Build Container Image
    runs-on: ubuntu-latest
    # Runs in parallel with code-analysis and unit-test: the image build takes
    # no input from them, and the publish gate on their results lives in the
    # build job below. A lint or test failure still reds the run through
    # all-checks.
    needs: [check-changes, setup]
    if: ${{ github.event_name != 'push' || needs.check-changes.outputs.code-changed == 'true' }}
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build container
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.app_name }}:test
          # Same scope as the tag build's amd64 leg: a tag run can only restore
          # caches written on its own ref or the default branch, so writing the
          # default "buildkit" scope here left every release build cold.
          cache-from: type=gha,scope=build-linux-amd64
          # PRs write mode=min: a PR cache is only restorable by re-runs of the
          # same PR, and a full mode=max export per PR crowds the repo's 10 GB
          # cache budget and evicts the branch caches releases restore from.
          cache-to: type=gha,scope=build-linux-amd64,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}
          push: false
          load: true
          build-args: |
            PYTHON_VERSION=${{ needs.setup.outputs.python-version }}

      - name: Save container image
        if: ${{ inputs.enable_kubernetes_tests || inputs.enable_container_tests }}
        run: |
          docker save ${{ inputs.app_name }}:test | \
            gzip > /tmp/${{ inputs.app_name }}.tar.gz

      - name: Upload container artifact
        if: ${{ inputs.enable_kubernetes_tests || inputs.enable_container_tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-image
          path: /tmp/${{ inputs.app_name }}.tar.gz
          retention-days: 1

  # Job 4b: Warm the arm64 layer cache from the default branch. The tag build's
  # arm64 leg restores scope build-linux-arm64, and a tag run can only read
  # caches written on its own ref or the default branch - without this job every
  # release built arm64 from scratch. Deliberately outside the release path and
  # absent from all-checks: a hiccup here costs one cold build, never a red run.
  warm-arm64:
    name: Warm arm64 Build Cache
    runs-on: ubuntu-24.04-arm
    needs: [check-changes, setup]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.check-changes.outputs.code-changed == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build arm64 image for cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          tags: ${{ inputs.app_name }}:warm-arm64
          cache-from: type=gha,scope=build-linux-arm64
          cache-to: type=gha,scope=build-linux-arm64,mode=max
          push: false
          build-args: |
            PYTHON_VERSION=${{ needs.setup.outputs.python-version }}

  # Job 5: Container Integration Tests
  container-test:
    name: Container Integration Test
    runs-on: ubuntu-latest
    needs: [check-changes, setup, build-container]
    if: ${{ inputs.enable_container_tests && needs.build-container.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download container artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-image
          path: /tmp

      - name: Container health check
        uses: mac-lucky/actions-shared-workflows/.github/actions/container-healthcheck@master
        with:
          image_tar: /tmp/${{ inputs.app_name }}.tar.gz
          container_name: ${{ inputs.app_name }}
          enable_security_scan: ${{ inputs.enable_security_scan }}

  # Job 6: Kubernetes Integration Tests (Optional)
  kubernetes-test:
    name: Kubernetes Integration Test
    runs-on: ubuntu-latest
    needs: [check-changes, setup, build-container]
    if: ${{ inputs.enable_kubernetes_tests && inputs.helm_chart_path != '' && needs.build-container.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download container artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-image
          path: /tmp

      - name: Load container image
        run: |
          gunzip -c /tmp/${{ inputs.app_name }}.tar.gz | docker load
          docker image ls -a

      - name: Setup Minikube
        uses: mac-lucky/actions-shared-workflows/.github/actions/setup-minikube@master

      - name: Load Docker image into Minikube
        run: |
          minikube image load ${{ inputs.app_name }}:test

      - name: Deploy with Helm
        uses: mac-lucky/actions-shared-workflows/.github/actions/helm-deploy@master
        with:
          chart_path: ${{ inputs.helm_chart_path }}
          release_name: ${{ inputs.helm_release_name != '' && inputs.helm_release_name || inputs.app_name }}
          app_name: ${{ inputs.app_name }}

      - name: Kubernetes health check
        uses: mac-lucky/actions-shared-workflows/.github/actions/kubernetes-healthcheck@master
        with:
          app_label_selector: ${{ inputs.app_label_selector != '' && inputs.app_label_selector || inputs.app_name }}

      - name: Check logs
        run: |
          APP_LABEL="${{ inputs.app_label_selector }}"
          if [ -z "$APP_LABEL" ]; then
            APP_LABEL="${{ inputs.app_name }}"
          fi

          sleep 30
          echo "=== Application logs ==="
          kubectl logs -l app=$APP_LABEL -n monitoring --tail=50

      - name: Test metrics endpoint
        if: ${{ inputs.enable_custom_metrics_test }}
        run: |
          RELEASE_NAME="${{ inputs.helm_release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${{ inputs.app_name }}"
          fi

          echo "=== Testing metrics endpoint ==="
          kubectl port-forward -n monitoring svc/$RELEASE_NAME ${{ inputs.metrics_port }}:${{ inputs.metrics_port }} &
          PF_PID=$!
          sleep 10

          # Test metrics endpoint
          response=$(curl -s http://localhost:${{ inputs.metrics_port }}/metrics)
          if echo "$response" | grep -q "${{ inputs.metrics_test_pattern }}"; then
            echo "✅ Metrics endpoint working - ${{ inputs.metrics_test_pattern }} found"
            echo "Sample metrics:"
            echo "$response" | head -20
          else
            echo "❌ Metrics endpoint not working - ${{ inputs.metrics_test_pattern }} not found"
            echo "Response received:"
            echo "$response"
            kill $PF_PID || true
            exit 1
          fi

          # Cleanup
          kill $PF_PID || true

      - name: Cleanup
        if: always()
        run: |
          RELEASE_NAME="${{ inputs.helm_release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${{ inputs.app_name }}"
          fi

          helm uninstall $RELEASE_NAME -n monitoring || true
          kubectl delete namespace monitoring || true

  # Job 7: Build platform-specific images in parallel
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [check-changes, setup, code-analysis, unit-test, build-container, container-test, kubernetes-test]
    # always() switches off the implicit "skip when a dependency failed" rule, so
    # every gate has to be checked explicitly or a failed job still publishes.
    # code-analysis and unit-test are gated here (not via build-container, which
    # runs in parallel with them); skipped passes because both are opt-out or
    # event-gated. Publishing is tag-gated.
    if: ${{ always() && needs.build-container.result == 'success' && (needs.code-analysis.result == 'success' || needs.code-analysis.result == 'skipped') && (needs.unit-test.result == 'success' || needs.unit-test.result == 'skipped') && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && (inputs.enable_container_tests == false || needs.container-test.result == 'success' || needs.container-test.result == 'skipped') && (inputs.enable_kubernetes_tests == false || needs.kubernetes-test.result == 'success' || needs.kubernetes-test.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      new-version: ${{ steps.set_version.outputs.new_version }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set version
        id: set_version
        run: |
          # Tag-driven release: the version is the tag itself, minus a leading v.
          NEW_VERSION="${GITHUB_REF_NAME#v}"
          # NEW_VERSION is interpolated into later shell steps (the merge job), and
          # it derives from a ref name any writer can craft, so reject anything
          # that is not a bare semver before it can reach a shell.
          if ! printf '%s' "$NEW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to build: version '$NEW_VERSION' is not a bare semver (ref: ${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Build this single arch into the local daemon so it can be scanned before push
      # (single-platform builds support load:true; multi-platform ones do not). Warms
      # the gha cache (mode=max) for the push build below.
      - name: Build image for scan
        id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ needs.setup.outputs.python-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          load: true
          push: false
          tags: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      # Build the effective Grype config from the org-wide ignore baseline. Fail-safe -
      # any error here leaves a valid empty config so the scan still runs.
      - name: Prepare Grype policy
        if: ${{ inputs.enable_security_scan }}
        shell: bash
        run: |
          set +e
          POLICY_URL="https://raw.githubusercontent.com/mac-lucky/actions-shared-workflows/master/security/grype-base-policy.yaml"
          if curl -sSfL "$POLICY_URL" -o ./.grype.yaml && [ -s ./.grype.yaml ]; then
            echo "Loaded org Grype baseline policy"
          else
            printf 'ignore: []\n' > ./.grype.yaml
            echo "WARN: org policy unavailable; starting from an empty ignore set"
          fi
          if ! python3 -c "import yaml; yaml.safe_load(open('./.grype.yaml'))" 2>/dev/null; then
            printf 'ignore: []\n' > ./.grype.yaml
          fi
          echo "----- effective .grype.yaml -----"
          cat ./.grype.yaml
          exit 0

      # Scan the built image; with fail-build:true a gating finding fails the job so the
      # push step never runs and merge (needs: build) is skipped - nothing is published.
      - name: Container security scan (Grype)
        id: scan
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/scan-action@8964e60c6fabdb85fdbbbfd9834d8f19c97a3086 # v7.4.1
        with:
          image: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          severity-cutoff: ${{ inputs.scan_severity_cutoff }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          fail-build: ${{ inputs.scan_fail_build }}

      - name: Upload scan SARIF
        continue-on-error: true
        if: ${{ inputs.enable_security_scan && always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ env.PLATFORM_PAIR }}

      # Cache hit from the scan build above; only exports/pushes layers by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ needs.setup.outputs.python-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_GHCR }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Job 8: Merge platform-specific images into multi-arch manifest
  merge:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [check-changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Prepare version
        run: |
          echo "NEW_VERSION=${{ needs.build.outputs.new-version }}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.NEW_VERSION }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push (GHCR)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Create manifest list and push (Docker Hub)
        if: ${{ inputs.push_to_dockerhub }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          LATEST=""
          case "${{ env.NEW_VERSION }}" in
            *-*) ;;  # prerelease never moves latest, matching the GHCR tag set
            *) LATEST="-t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:latest" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:${{ env.NEW_VERSION }} \
            $LATEST \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}

      - name: Generate SBOM
        if: ${{ inputs.enable_sbom }}
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  # Job 9: Post-deployment verification
  post-deploy-verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [check-changes, build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Verify deployed image
        uses: mac-lucky/actions-shared-workflows/.github/actions/verify-deployed-image@master
        with:
          registry_image: ${{ env.REGISTRY_IMAGE_GHCR }}
          github_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.new-version }}

  # Job 10: GitHub Release with generated notes
  # No permissions block on purpose: it inherits the caller job's grant, which
  # must include contents:write for tag runs. Declaring it here would instead
  # compile-fail every caller that grants less on every event.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}
          path_filter: ${{ inputs.release_notes_path_filter }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=""
          if [ -f sbom.spdx.json ]; then
            ASSETS="sbom.spdx.json"
          fi
          # Idempotent: re-running a tag workflow (a normal recovery path) must
          # refresh the release, not die on "already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            if [ -n "$ASSETS" ]; then
              # shellcheck disable=SC2086
              gh release upload "${GITHUB_REF_NAME}" $ASSETS --clobber
            fi
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              $ASSETS
          fi

  # Job 11: the single status check a branch ruleset should require.
  # Every other job name here ends in a matrix expansion, so a ruleset naming
  # them directly breaks whenever a platform or analysis tool is added or
  # renamed. This name is fixed, so callers only ever have to require
  # "<caller job id> / All checks passed".
  # No permissions block on purpose, for the same reason as the release job.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [check-changes, setup, code-analysis, unit-test, build-container, container-test, kubernetes-test, build, merge, post-deploy-verify, release]
    if: ${{ always() }}
    steps:
      # skipped counts as a pass: most jobs here are gated on event type or on
      # an opt-in input, so a PR run legitimately skips much of the workflow
      # and must still report green.
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more jobs failed or were cancelled"
          exit 1
