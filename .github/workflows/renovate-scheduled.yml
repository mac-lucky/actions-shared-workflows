name: Scheduled Renovate

# One runner for the whole account instead of a Renovate workflow per repo.
# Autodiscovery finds every mac-lucky repo, but onboarding:false +
# requireConfig:required mean it acts only on repos that already contain a
# Renovate config - so a repo opts in by adding one, and nothing here changes.
# Shared config lives in default.json at the root of this repo; repos reference
# it as "github>mac-lucky/actions-shared-workflows".

on:
  schedule:
    - cron: '0 3 * * *'  # 5am Warsaw (CEST) / 4am (CET). Clear of the 01:00 GHCR cleanup.
  workflow_dispatch:
    inputs:
      dryRun:
        description: Report what would happen without writing branches or PRs
        type: choice
        default: full
        options:
          - disabled
          - extract
          - lookup
          - full

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No repository cache on purpose. Every run that restored one died at
      # startup with "FATAL: Unknown error" (2026-07-31: four failures, and a
      # chown of the restored tree did not help), while every cache-less run
      # succeeded. The cache only saves lookup time on a daily job; cold
      # resolution is the reliable trade.

      - name: Run Renovate
        uses: renovatebot/github-action@973d3e5a68e735a444e8c03432b66eedb343c302 # v46.2.0
        with:
          # Not GITHUB_TOKEN: it is scoped to this repo only, and pushes made
          # with it do not trigger other workflows - which would mean a merged
          # bump never rebuilds the image it was raised for.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: mac-lucky/*
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Without this, forks (derper-docker, plausible-exporter) are skipped
          # before their renovate.json is even read. Safe with requireConfig:
          # only forks that deliberately carry a config are processed.
          RENOVATE_FORK_PROCESSING: enabled
          # inputs is null on a schedule run, so a scheduled run is always live.
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'disabled' && inputs.dryRun || '' }}
          LOG_LEVEL: info
