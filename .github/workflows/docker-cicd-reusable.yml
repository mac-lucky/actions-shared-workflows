---
name: Reusable Docker CI/CD Workflow

# Tag-gated model: every event runs the test job (single-arch build, Grype
# scan, optional smoke test); only pushes of a version tag (vX.Y.Z, optionally
# -rN for a rebuild of the same upstream version) build both arches, push to
# the registries, and cut a GitHub Release with generated notes. Upstream
# version tracking moved to Renovate custom managers in each caller repo: the
# Dockerfile ARG is the single source of truth, and the auto-tag workflow turns
# a merged bump into the tag that triggers the release.

on:
  workflow_call:
    secrets:
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKER_HUB_PASSWORD:
        description: 'Docker Hub password/token'
        required: false
    inputs:
      # Application configuration
      app_name:
        description: 'Application name'
        required: true
        type: string
      dockerhub_image:
        description: 'Docker Hub image name (e.g., maclucky/app-name); only needed with push_to_dockerhub'
        required: false
        type: string
        default: ''
      ghcr_image:
        description: 'GHCR image name (e.g., ghcr.io/mac-lucky/app-name)'
        required: true
        type: string

      # Deprecated inputs. Declared so existing callers keep compiling; the
      # machinery they controlled (upstream polling, schedule builds, version
      # build-arg injection) was replaced by Renovate + tag-gated releases.
      upstream_repo:
        description: '(deprecated, ignored) upstream tracking moved to Renovate custom managers'
        required: false
        type: string
        default: ''
      version_strip_prefix:
        description: '(deprecated, ignored)'
        required: false
        type: string
        default: 'v'
      build_arg_name:
        description: '(deprecated, ignored) Dockerfile ARG defaults are the source of truth'
        required: false
        type: string
        default: ''
      enable_version_check:
        description: '(deprecated, ignored)'
        required: false
        type: boolean
        default: false
      enable_schedule_build:
        description: '(deprecated, ignored)'
        required: false
        type: boolean
        default: true
      force_build:
        description: '(deprecated, ignored)'
        required: false
        type: boolean
        default: false
      platforms:
        description: '(deprecated, ignored) the arch matrix is fixed to linux/amd64 + linux/arm64'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

      # Build configuration
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'

      # Test configuration
      smoke_test_script:
        description: >-
          Shell script run against the freshly built amd64 image in the test
          job; the image reference is in $SMOKE_IMAGE. A non-zero exit fails
          the job (and so blocks any publish that needs it).
        required: false
        type: string
        default: ''

      # Security and quality
      enable_security_scan:
        description: 'Enable security scanning with Grype'
        required: false
        type: boolean
        default: true
      scan_severity_cutoff:
        description: 'Grype severity at/above which findings count (negligible|low|medium|high|critical)'
        required: false
        type: string
        default: 'high'
      scan_only_fixed:
        description: 'Only gate on vulnerabilities that have a fix available'
        required: false
        type: boolean
        default: true
      scan_fail_build:
        description: 'Fail the build (block the push) when the image scan finds gating vulnerabilities'
        required: false
        type: boolean
        default: true
      govulncheck_binary:
        description: 'Path to an upstream Go binary inside the image to reachability-scan with govulncheck (e.g. /usr/bin/caddy); empty disables it'
        required: false
        type: string
        default: ''

      # Deployment
      push_to_dockerhub:
        description: 'Push images to Docker Hub (in addition to GHCR)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY_IMAGE_DOCKERHUB: ${{ inputs.dockerhub_image }}
  REGISTRY_IMAGE_GHCR: ${{ inputs.ghcr_image }}

jobs:
  # Job 1: Build and test (every event; the PR gate and the release gate)
  test:
    name: Build and Test (amd64)
    runs-on: ubuntu-latest
    # Stale callers may still fire schedule triggers; those no-op here.
    if: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ inputs.app_name }}:test
          cache-from: type=gha,scope=build-linux-amd64
          # PRs write mode=min: a PR cache is only restorable by re-runs of the
          # same PR, and a full mode=max export per PR crowds the repo's 10 GB
          # cache budget and evicts the branch caches releases restore from.
          cache-to: type=gha,scope=build-linux-amd64,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}

      # Compiling govulncheck from source takes minutes; the key hardcodes the
      # version pinned in the install command below.
      - name: Cache govulncheck binary
        if: ${{ inputs.enable_security_scan && inputs.govulncheck_binary != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/govulncheck
          key: gotool-govulncheck-${{ runner.os }}-${{ runner.arch }}-v1.6.0

      # Build the effective Grype config: the org-wide ignore baseline, plus
      # (for Go binaries) automatic reachability suppression from govulncheck
      # VEX. Fail-safe - any error here leaves a valid empty config so the scan
      # still runs.
      - name: Prepare Grype policy
        if: ${{ inputs.enable_security_scan }}
        shell: bash
        env:
          GOVULN_BINARY: ${{ inputs.govulncheck_binary }}
          SCAN_IMAGE: ${{ inputs.app_name }}:test
        run: |
          set +e
          POLICY_URL="https://raw.githubusercontent.com/mac-lucky/actions-shared-workflows/master/security/grype-base-policy.yaml"
          if curl -sSfL "$POLICY_URL" -o ./.grype.yaml && [ -s ./.grype.yaml ]; then
            echo "Loaded org Grype baseline policy"
          else
            printf 'ignore: []\n' > ./.grype.yaml
            echo "WARN: org policy unavailable; starting from an empty ignore set"
          fi
          # A repo may append its own ignore entries. This exists so exemptions
          # for one image's vendored binaries stay in that repo instead of being
          # added to the org baseline, where a path glob would silently un-gate
          # the same path in every other caller.
          if [ -s ./.grype-ignore.yaml ]; then
            cat ./.grype-ignore.yaml >> ./.grype.yaml
            # Concatenating YAML is indentation-sensitive: the repo file's list
            # items must sit at the same indent as the baseline's. A bad merge
            # is caught by the yaml.safe_load validation below, which resets to
            # an empty ignore set.
            echo "Appended repo-local .grype-ignore.yaml"
          fi
          if [ -n "${GOVULN_BINARY}" ]; then
            cid="$(docker create "${SCAN_IMAGE}" 2>/dev/null)"
            if [ -n "$cid" ] && docker cp "${cid}:${GOVULN_BINARY}" /tmp/govuln-bin 2>/dev/null; then
              GVC="$(go env GOPATH)/bin/govulncheck"
              [ -x "$GVC" ] || go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 2>/dev/null
              if [ -x "$GVC" ] && "$GVC" -mode binary -format openvex /tmp/govuln-bin > ./govulncheck.vex.json 2>/dev/null && [ -s ./govulncheck.vex.json ]; then
                printf 'vex-documents:\n  - ./govulncheck.vex.json\n' >> ./.grype.yaml
                echo "Added govulncheck reachability VEX for ${GOVULN_BINARY}"
              else
                echo "WARN: govulncheck produced no VEX; skipping reachability layer"
              fi
            else
              echo "WARN: could not extract ${GOVULN_BINARY} from image; skipping reachability layer"
            fi
            [ -n "$cid" ] && docker rm "$cid" >/dev/null 2>&1
          fi
          if ! python3 -c "import yaml; yaml.safe_load(open('./.grype.yaml'))" 2>/dev/null; then
            echo "WARN: generated .grype.yaml is invalid; resetting to empty ignore set"
            printf 'ignore: []\n' > ./.grype.yaml
          fi
          echo "----- effective .grype.yaml -----"
          cat ./.grype.yaml
          exit 0

      - name: Container security scan (Grype)
        id: scan
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.app_name }}:test
          severity-cutoff: ${{ inputs.scan_severity_cutoff }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          fail-build: ${{ inputs.scan_fail_build }}

      - name: Upload scan SARIF
        continue-on-error: true
        if: ${{ inputs.enable_security_scan && always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-test

      - name: Smoke test
        if: ${{ inputs.smoke_test_script != '' }}
        env:
          SMOKE_IMAGE: ${{ inputs.app_name }}:test
        # Explicit bash so the script runs with -o pipefail: a failing command
        # on the left of a pipe (wget | head) must fail the step.
        shell: bash
        run: ${{ inputs.smoke_test_script }}

  # Job 1b: Warm the arm64 layer cache from the default branch. The tag build's
  # arm64 leg restores scope build-linux-arm64, and a tag run can only read
  # caches written on its own ref or the default branch - without this job every
  # release built arm64 from scratch (the test job is amd64-only). Deliberately
  # outside the release path and absent from all-checks: a hiccup here costs
  # one cold build, never a red run.
  warm-arm64:
    name: Warm arm64 Build Cache
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build arm64 image for cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          tags: ${{ inputs.app_name }}:warm-arm64
          cache-from: type=gha,scope=build-linux-arm64
          cache-to: type=gha,scope=build-linux-arm64,mode=max
          push: false

  # Job 2: Build platform-specific images in parallel (version tags only)
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: test
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.vars.outputs.version }}
      base_version: ${{ steps.vars.outputs.base_version }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Compute version from tag
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The version is interpolated into shell steps and image tags, and it
          # derives from a ref name any writer can craft: accept only dotted
          # numerics with an optional suffix (prerelease or -rN rebuild).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to build: tag '$GITHUB_REF_NAME' is not a version tag."
            exit 1
          fi
          BASE_VERSION=$(printf '%s' "$VERSION" | sed -E 's/-r[0-9]+$//')
          {
            echo "version=$VERSION"
            echo "base_version=$BASE_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.BASE_VERSION }},enable=${{ env.BASE_VERSION != env.VERSION }}
            type=raw,value=latest

      # Build this single arch into the local daemon so it can be scanned before
      # anything is pushed. A single-platform build supports load:true (a multi-platform
      # one does not). This also warms the gha cache (mode=max) for the push build below.
      - name: Build image for scan
        id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          tags: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      # Compiling govulncheck from source takes minutes; the key hardcodes the
      # version pinned in the install command below.
      - name: Cache govulncheck binary
        if: ${{ inputs.enable_security_scan && inputs.govulncheck_binary != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/govulncheck
          key: gotool-govulncheck-${{ runner.os }}-${{ runner.arch }}-v1.6.0

      # Build the effective Grype config; same logic as the test job. Runs per
      # arch because the arm64 image is a different artifact.
      - name: Prepare Grype policy
        if: ${{ inputs.enable_security_scan }}
        shell: bash
        env:
          GOVULN_BINARY: ${{ inputs.govulncheck_binary }}
          SCAN_IMAGE: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
        run: |
          set +e
          POLICY_URL="https://raw.githubusercontent.com/mac-lucky/actions-shared-workflows/master/security/grype-base-policy.yaml"
          if curl -sSfL "$POLICY_URL" -o ./.grype.yaml && [ -s ./.grype.yaml ]; then
            echo "Loaded org Grype baseline policy"
          else
            printf 'ignore: []\n' > ./.grype.yaml
            echo "WARN: org policy unavailable; starting from an empty ignore set"
          fi
          if [ -s ./.grype-ignore.yaml ]; then
            cat ./.grype-ignore.yaml >> ./.grype.yaml
            echo "Appended repo-local .grype-ignore.yaml"
          fi
          if [ -n "${GOVULN_BINARY}" ]; then
            cid="$(docker create "${SCAN_IMAGE}" 2>/dev/null)"
            if [ -n "$cid" ] && docker cp "${cid}:${GOVULN_BINARY}" /tmp/govuln-bin 2>/dev/null; then
              GVC="$(go env GOPATH)/bin/govulncheck"
              [ -x "$GVC" ] || go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 2>/dev/null
              if [ -x "$GVC" ] && "$GVC" -mode binary -format openvex /tmp/govuln-bin > ./govulncheck.vex.json 2>/dev/null && [ -s ./govulncheck.vex.json ]; then
                printf 'vex-documents:\n  - ./govulncheck.vex.json\n' >> ./.grype.yaml
                echo "Added govulncheck reachability VEX for ${GOVULN_BINARY}"
              else
                echo "WARN: govulncheck produced no VEX; skipping reachability layer"
              fi
            else
              echo "WARN: could not extract ${GOVULN_BINARY} from image; skipping reachability layer"
            fi
            [ -n "$cid" ] && docker rm "$cid" >/dev/null 2>&1
          fi
          if ! python3 -c "import yaml; yaml.safe_load(open('./.grype.yaml'))" 2>/dev/null; then
            echo "WARN: generated .grype.yaml is invalid; resetting to empty ignore set"
            printf 'ignore: []\n' > ./.grype.yaml
          fi
          echo "----- effective .grype.yaml -----"
          cat ./.grype.yaml
          exit 0

      # Scan the built image. With fail-build:true this fails the job on a gating
      # finding, so the push step below never runs and merge (needs: build) is skipped.
      - name: Container security scan (Grype)
        id: scan
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          severity-cutoff: ${{ inputs.scan_severity_cutoff }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          fail-build: ${{ inputs.scan_fail_build }}

      - name: Upload scan SARIF
        continue-on-error: true
        if: ${{ inputs.enable_security_scan && always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ env.PLATFORM_PAIR }}

      # Cache hit from the scan build above; this only exports/pushes layers by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_GHCR }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Job 3: Merge platform-specific images into multi-arch manifest
  merge:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Prepare version
        run: |
          echo "VERSION=${{ needs.build.outputs.version }}" >> $GITHUB_ENV
          echo "BASE_VERSION=${{ needs.build.outputs.base_version }}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.BASE_VERSION }},enable=${{ env.BASE_VERSION != env.VERSION }}
            type=raw,value=latest

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push (GHCR)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Create manifest list and push (Docker Hub)
        if: ${{ inputs.push_to_dockerhub }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          EXTRA=""
          if [ "${{ env.BASE_VERSION }}" != "${{ env.VERSION }}" ]; then
            EXTRA="-t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:${{ env.BASE_VERSION }}"
          fi
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:${{ env.VERSION }} \
            -t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:latest \
            $EXTRA \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.VERSION }}

      - name: Generate image SBOM (Syft)
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: '${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.VERSION }}'
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # The image is vuln-scanned per-arch in the build job before push (see build job);
      # here we only preserve the final multi-arch SBOM as a supply-chain artifact.
      - name: Upload SBOM artifact
        if: ${{ inputs.enable_security_scan }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  # Job 4: Post-deployment verification
  post-deploy-verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Verify deployed image
        uses: mac-lucky/actions-shared-workflows/.github/actions/verify-deployed-image@master
        with:
          registry_image: ${{ env.REGISTRY_IMAGE_GHCR }}
          github_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.version }}

  # Job 5: GitHub Release with generated notes
  # No permissions block on purpose: it inherits the caller job's grant, which
  # must include contents:write for tag runs. Declaring it here would instead
  # compile-fail every caller that grants less on every event.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        if: ${{ inputs.enable_security_scan }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=""
          if [ -f sbom.spdx.json ]; then
            ASSETS="sbom.spdx.json"
          fi
          # Idempotent: re-running a tag workflow (a normal recovery path) must
          # refresh the release, not die on "already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            if [ -n "$ASSETS" ]; then
              # shellcheck disable=SC2086
              gh release upload "${GITHUB_REF_NAME}" $ASSETS --clobber
            fi
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              $ASSETS
          fi

  # Job 6: the single status check a branch ruleset should require.
  # Every other job name here ends in a matrix expansion, so a ruleset naming
  # them directly breaks whenever a platform is added or renamed. This name is
  # fixed, so callers only ever have to require "<caller job id> / All checks
  # passed".
  # No permissions block on purpose, for the same reason as the release job.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [test, build, merge, post-deploy-verify, release]
    if: ${{ always() }}
    steps:
      # skipped counts as a pass: everything from build onwards is gated on the
      # event being a tag push, so a PR run legitimately skips most of the
      # workflow and must still report green.
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more jobs failed or were cancelled"
          exit 1
