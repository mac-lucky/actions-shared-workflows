---
name: Reusable Go CI/CD Workflow

on:
  workflow_call:
    secrets:
      DOCKER_HUB_USERNAME:
        description: 'Docker Hub username'
        required: false
      DOCKER_HUB_PASSWORD:
        description: 'Docker Hub password/token'
        required: false
      HELM_CHART_REPO_TOKEN:
        description: 'PAT for checking out a private Helm chart repository'
        required: false
    inputs:
      # Application configuration
      app_name:
        description: 'Application name'
        required: true
        type: string
      dockerhub_image:
        description: 'Docker Hub image name (e.g., maclucky/app-name)'
        required: true
        type: string
      ghcr_image:
        description: 'GHCR image name (e.g., ghcr.io/mac-lucky/app-name)'
        required: true
        type: string
      
      # Build configuration
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      go_module_path:
        description: 'Path to Go module directory relative to repo root (e.g., ./github)'
        required: false
        type: string
        default: '.'

      # Test configuration
      enable_container_tests:
        description: 'Enable container integration tests'
        required: false
        type: boolean
        default: true
      enable_kubernetes_tests:
        description: 'Enable Kubernetes integration tests'
        required: false
        type: boolean
        default: false
      helm_chart_path:
        description: 'Path to Helm chart for Kubernetes tests'
        required: false
        type: string
        default: ''
      helm_chart_repo:
        description: 'External repository containing the Helm chart (e.g., owner/repo). If set, the repo is checked out alongside the main code.'
        required: false
        type: string
        default: ''
      helm_chart_repo_ref:
        description: 'Branch or ref for the external Helm chart repository'
        required: false
        type: string
        default: 'master'
      helm_release_name:
        description: 'Helm release name for deployment'
        required: false
        type: string
        default: ''
      app_label_selector:
        description: 'App label selector for Kubernetes pods (e.g., ping-exporter, tcp-endpoint-check-exporter)'
        required: false
        type: string
        default: ''
      container_test_pre_script:
        description: 'Shell script to run before the container test (e.g., start dependencies)'
        required: false
        type: string
        default: ''
      container_test_run_args:
        description: 'Extra flags for docker run in container test (e.g., env vars, volumes, networks)'
        required: false
        type: string
        default: ''
      container_test_health_url:
        description: 'HTTP URL to curl for container health verification'
        required: false
        type: string
        default: ''
      enable_custom_metrics_test:
        description: 'Enable custom metrics endpoint test with port-forward'
        required: false
        type: boolean
        default: false
      metrics_port:
        description: 'Port for metrics endpoint (e.g., 9107)'
        required: false
        type: string
        default: ''
      metrics_test_pattern:
        description: 'Pattern to search for in metrics output (e.g., ping_loss_ratio)'
        required: false
        type: string
        default: ''

      # Go test configuration
      enable_go_tests:
        description: 'Enable Go unit/integration tests (go test ./...)'
        required: false
        type: boolean
        default: false
      go_test_args:
        description: 'Extra arguments for go test (e.g., -race -count=1 -timeout 10m)'
        required: false
        type: string
        default: ''

      # Security and quality
      enable_security_scan:
        description: 'Enable security scanning with Grype'
        required: false
        type: boolean
        default: true
      enable_sbom:
        description: 'Generate Software Bill of Materials'
        required: false
        type: boolean
        default: true
      scan_severity_cutoff:
        description: 'Grype severity at/above which findings count (negligible|low|medium|high|critical)'
        required: false
        type: string
        default: 'high'
      scan_only_fixed:
        description: 'Only gate on vulnerabilities that have a fix available'
        required: false
        type: boolean
        default: true
      scan_fail_build:
        description: 'Fail the build (block the push) when the image scan finds gating vulnerabilities'
        required: false
        type: boolean
        default: true
      # Analysis tools are pinned so an upstream release cannot turn a caller red
      # without a commit. These findings gate the publish, so a surprise is costly.
      staticcheck_version:
        description: 'staticcheck version tag to install'
        required: false
        type: string
        default: 'v0.7.0'
      govulncheck_version:
        description: 'govulncheck version tag to install. Pins the binary, not the vulnerability database - that is still fetched at run time, so new CVEs still fail the job.'
        required: false
        type: string
        default: 'v1.6.0'
      gosec_version:
        description: 'gosec version tag to install'
        required: false
        type: string
        default: 'v2.28.0'
      code_analysis_tools:
        description: 'JSON array of analysis tools to run, a subset of ["go-vet","staticcheck","govulncheck","gosec"]. Trim it when a parallel golangci-lint workflow already covers vet and staticcheck.'
        required: false
        type: string
        default: '["go-vet", "staticcheck", "govulncheck", "gosec"]'
      
      # Deployment. Tag pushes always publish: the tag may be plain "v<semver>"
      # or prefixed "<name>/v<semver>" (the prefix is stripped before parsing),
      # and the image gets X.Y.Z, X.Y, X (for >=1.0) and latest tags plus a
      # GitHub Release with generated notes.
      enable_auto_version:
        description: '(deprecated, ignored) publishing is tag-gated; versions come from the git tag'
        required: false
        type: boolean
        default: true
      enable_main_dev_tag:
        description: 'On main pushes, additionally publish :main + :main-<short-sha> dev images (used by repos that deploy from main between releases)'
        required: false
        type: boolean
        default: false
      release_on_tag:
        description: '(deprecated, ignored) tag pushes always publish now'
        required: false
        type: boolean
        default: false
      push_on_main:
        description: '(deprecated, ignored) main pushes only build and test; use enable_main_dev_tag for dev images'
        required: false
        type: boolean
        default: true
      release_notes_path_filter:
        description: 'Limit release-note commits to this path (e.g. ./relay for a monorepo component); empty includes all commits'
        required: false
        type: string
        default: ''
      push_to_dockerhub:
        description: 'Push images to Docker Hub (in addition to GHCR)'
        required: false
        type: boolean
        default: false
      main_branch:
        description: 'Main branch name used for push gating (e.g., main or master)'
        required: false
        type: string
        default: 'master'

      # Runner configuration
      runner_default:
        description: 'Default runner for CI jobs (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      runner_amd64:
        description: 'Runner for amd64 builds (e.g., ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      runner_arm64:
        description: 'Runner for arm64 builds (e.g., ubuntu-24.04-arm or self-hosted)'
        required: false
        type: string
        default: 'ubuntu-24.04-arm'
      skip_qemu_setup:
        description: 'Skip QEMU setup. Defaults to true because the arm64 legs run on native arm runners; set false only when runner_arm64 is an amd64 machine that emulates.'
        required: false
        type: boolean
        default: true

env:
  REGISTRY_IMAGE_DOCKERHUB: ${{ inputs.dockerhub_image }}
  REGISTRY_IMAGE_GHCR: ${{ inputs.ghcr_image }}

jobs:
  # Job 1: Check for code changes
  check-changes:
    name: Check for Code Changes
    runs-on: ${{ inputs.runner_default }}
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The change check diffs the tip commit against its parent only.
          fetch-depth: 2

      - name: Check for code changes
        id: changes
        uses: mac-lucky/actions-shared-workflows/.github/actions/check-code-changes@master
        with:
          file_patterns: '\.(go|mod|sum)$|Dockerfile|^(src|cmd|internal|pkg)/'
          event_name: ${{ github.event_name }}

  setup:
    name: Setup Build Environment
    runs-on: ${{ inputs.runner_default }}
    needs: check-changes
    outputs:
      go-version: ${{ steps.go-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract Go version from go.mod
        id: go-version
        run: |
          # Extract Go version from go.mod
          GO_VERSION=$(grep "^go " ${{ inputs.go_module_path }}/go.mod | cut -d' ' -f2)
          echo "Found Go version in go.mod: $GO_VERSION"

          # Set version for builds
          echo "version=$GO_VERSION" >> $GITHUB_OUTPUT

  # Job 3: Code Quality & Security Analysis (parallel matrix)
  code-analysis:
    name: Code Analysis (${{ matrix.tool }})
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup]
    if: ${{ inputs.code_analysis_tools != '[]' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.check-changes.outputs.code-changed == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.code_analysis_tools) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.setup.outputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.go_module_path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.go_module_path }}
        run: go mod download

      - name: Verify dependencies
        if: matrix.tool == 'go-vet'
        working-directory: ${{ inputs.go_module_path }}
        run: go mod verify

      - name: Run go vet
        if: matrix.tool == 'go-vet'
        working-directory: ${{ inputs.go_module_path }}
        run: |
          if OUTPUT=$(go vet ./... 2>&1); then
            echo "## :white_check_mark: Go Vet" >> $GITHUB_STEP_SUMMARY
            echo "No issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Go Vet" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Pinning the version is what makes caching the binary sound: the key can
      # describe exactly what is in the cache. Building gosec from source takes
      # minutes on a 2-core runner, and code-analysis gates the container build.
      - name: Cache analysis tool
        if: matrix.tool != 'go-vet'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin/${{ matrix.tool }}
          # Keyed on this tool's own version only: one key spanning all three
          # versions meant bumping any tool cold-missed the other two as well.
          key: gotool-${{ matrix.tool }}-${{ runner.os }}-${{ runner.arch }}-${{ needs.setup.outputs.go-version }}-${{ matrix.tool == 'staticcheck' && inputs.staticcheck_version || matrix.tool == 'govulncheck' && inputs.govulncheck_version || inputs.gosec_version }}

      - name: Run staticcheck
        if: matrix.tool == 'staticcheck'
        id: staticcheck
        working-directory: ${{ inputs.go_module_path }}
        env:
          TOOL_VERSION: ${{ inputs.staticcheck_version }}
        run: |
          command -v staticcheck > /dev/null || go install honnef.co/go/tools/cmd/staticcheck@"$TOOL_VERSION"
          if OUTPUT=$(staticcheck ./... 2>&1); then
            echo "## :white_check_mark: Staticcheck" >> $GITHUB_STEP_SUMMARY
            echo "No issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Staticcheck" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run govulncheck
        if: matrix.tool == 'govulncheck'
        working-directory: ${{ inputs.go_module_path }}
        env:
          TOOL_VERSION: ${{ inputs.govulncheck_version }}
        run: |
          command -v govulncheck > /dev/null || go install golang.org/x/vuln/cmd/govulncheck@"$TOOL_VERSION"
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT_CODE -eq 0 ]; then
            echo "## :white_check_mark: Go Vulnerability Check" >> $GITHUB_STEP_SUMMARY
            echo "No vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Go Vulnerability Check" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run gosec
        if: matrix.tool == 'gosec'
        working-directory: ${{ inputs.go_module_path }}
        env:
          TOOL_VERSION: ${{ inputs.gosec_version }}
        run: |
          command -v gosec > /dev/null || go install github.com/securego/gosec/v2/cmd/gosec@"$TOOL_VERSION"
          set +e
          OUTPUT=$(gosec -fmt text ./... 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "## :white_check_mark: Go Security Scanner" >> $GITHUB_STEP_SUMMARY
            echo "No issues found." >> $GITHUB_STEP_SUMMARY
          else
            echo "## :warning: Go Security Scanner" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # Job 3b: Go Tests (optional)
  go-test:
    name: Go Tests
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup]
    if: ${{ inputs.enable_go_tests && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.check-changes.outputs.code-changed == 'true') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.setup.outputs.go-version }}
          cache: true
          cache-dependency-path: ${{ inputs.go_module_path }}/go.sum

      - name: Download dependencies
        working-directory: ${{ inputs.go_module_path }}
        run: go mod download

      - name: Run tests
        working-directory: ${{ inputs.go_module_path }}
        run: |
          set +e
          OUTPUT=$(go test ${{ inputs.go_test_args }} ./... 2>&1)
          EXIT_CODE=$?
          set -e

          # Count individual test results (available with -v flag)
          PASSED=$(echo "$OUTPUT" | grep -c '^--- PASS:' || true)
          FAILED=$(echo "$OUTPUT" | grep -c '^--- FAIL:' || true)
          SKIPPED=$(echo "$OUTPUT" | grep -c '^--- SKIP:' || true)
          TOTAL=$((PASSED + FAILED + SKIPPED))

          # Header
          if [ $EXIT_CODE -eq 0 ]; then
            echo "## :white_check_mark: Go Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "## :x: Go Tests" >> $GITHUB_STEP_SUMMARY
          fi

          # Summary counts (only when -v output is present)
          if [ $TOTAL -gt 0 ]; then
            echo "> **${PASSED} passed** · ${FAILED} failed · ${SKIPPED} skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Package results table
          PKG_LINES=$(echo "$OUTPUT" | grep -E '^(ok|FAIL|\?)\s' || true)
          if [ -n "$PKG_LINES" ]; then
            echo "| Package | Status | Duration |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|--------|----------|" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r line; do
              STATUS=$(echo "$line" | awk '{print $1}')
              PKG=$(echo "$line" | awk '{print $2}')
              DUR=$(echo "$line" | grep -oE '[0-9]+\.[0-9]+s' | head -1)
              if [ "$STATUS" = "ok" ]; then
                echo "| \`${PKG}\` | :white_check_mark: pass | ${DUR:-—} |" >> $GITHUB_STEP_SUMMARY
              elif [ "$STATUS" = "FAIL" ]; then
                echo "| \`${PKG}\` | :x: fail | ${DUR:-—} |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| \`${PKG}\` | :package: no tests | — |" >> $GITHUB_STEP_SUMMARY
              fi
            done <<< "$PKG_LINES"
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Full output: collapsible on pass, visible on fail
          if [ $EXIT_CODE -eq 0 ]; then
            echo "<details><summary>Full output</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -eq 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          exit $EXIT_CODE

  # Job 4: Build Container Image
  build-container:
    name: Build Container Image
    runs-on: ${{ inputs.runner_default }}
    # Runs in parallel with code-analysis and go-test: the image build takes no
    # input from them, and the publish gate on their results lives in the build
    # job below. A lint or test failure still reds the run through all-checks.
    needs: [check-changes, setup]
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || needs.check-changes.outputs.code-changed == 'true' }}
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build container
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ inputs.app_name }}:test
          # Same scope as the tag build's amd64 leg: a tag run can only restore
          # caches written on its own ref or the default branch, so writing the
          # default "buildkit" scope here left every release build cold.
          cache-from: type=gha,scope=build-linux-amd64
          # PRs write mode=min: a PR cache is only restorable by re-runs of the
          # same PR, and a full mode=max export per PR crowds the repo's 10 GB
          # cache budget and evicts the branch caches releases restore from.
          cache-to: type=gha,scope=build-linux-amd64,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}
          push: false
          load: true
          build-args: |
            GO_VERSION=${{ needs.setup.outputs.go-version }}

      - name: Save container image
        if: ${{ inputs.enable_kubernetes_tests || inputs.enable_container_tests }}
        run: |
          docker save ${{ inputs.app_name }}:test | \
            gzip > /tmp/${{ inputs.app_name }}.tar.gz

      - name: Upload container artifact
        if: ${{ inputs.enable_kubernetes_tests || inputs.enable_container_tests }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-image
          path: /tmp/${{ inputs.app_name }}.tar.gz
          retention-days: 1

  # Job 4b: Warm the arm64 layer cache from the default branch. The tag build's
  # arm64 leg restores scope build-linux-arm64, and a tag run can only read
  # caches written on its own ref or the default branch - without this job every
  # release built arm64 from scratch. Deliberately outside the release path and
  # absent from all-checks: a hiccup here costs one cold build, never a red run.
  warm-arm64:
    name: Warm arm64 Build Cache
    runs-on: ${{ inputs.runner_arm64 }}
    needs: [check-changes, setup]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.check-changes.outputs.code-changed == 'true' }}
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        if: ${{ !inputs.skip_qemu_setup }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build arm64 image for cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          tags: ${{ inputs.app_name }}:warm-arm64
          cache-from: type=gha,scope=build-linux-arm64
          cache-to: type=gha,scope=build-linux-arm64,mode=max
          push: false
          build-args: |
            GO_VERSION=${{ needs.setup.outputs.go-version }}

  # Job 5: Container Integration Tests
  container-test:
    name: Container Integration Test
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, build-container]
    if: ${{ inputs.enable_container_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download container artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-image
          path: /tmp

      - name: Container health check
        uses: mac-lucky/actions-shared-workflows/.github/actions/container-healthcheck@master
        with:
          image_tar: /tmp/${{ inputs.app_name }}.tar.gz
          container_name: ${{ inputs.app_name }}
          enable_security_scan: ${{ inputs.enable_security_scan }}
          pre_test_script: ${{ inputs.container_test_pre_script }}
          docker_run_args: ${{ inputs.container_test_run_args }}
          health_check_url: ${{ inputs.container_test_health_url }}

  # Job 6: Kubernetes Integration Tests (Optional)
  kubernetes-test:
    name: Kubernetes Integration Test
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, build-container]
    if: ${{ inputs.enable_kubernetes_tests && inputs.helm_chart_path != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout Helm chart repository
        if: ${{ inputs.helm_chart_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.helm_chart_repo }}
          ref: ${{ inputs.helm_chart_repo_ref }}
          path: helm-chart-repo
          token: ${{ secrets.HELM_CHART_REPO_TOKEN || github.token }}

      - name: Download container artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: container-image
          path: /tmp

      - name: Load container image
        run: |
          gunzip -c /tmp/${{ inputs.app_name }}.tar.gz | docker load
          docker image ls -a

      - name: Setup Minikube
        uses: mac-lucky/actions-shared-workflows/.github/actions/setup-minikube@master

      - name: Load Docker image into Minikube
        run: |
          minikube image load ${{ inputs.app_name }}:test

      - name: Deploy with Helm
        uses: mac-lucky/actions-shared-workflows/.github/actions/helm-deploy@master
        with:
          chart_path: ${{ inputs.helm_chart_repo != '' && format('./helm-chart-repo/{0}', inputs.helm_chart_path) || inputs.helm_chart_path }}
          release_name: ${{ inputs.helm_release_name != '' && inputs.helm_release_name || inputs.app_name }}
          app_name: ${{ inputs.app_name }}

      - name: Kubernetes health check
        uses: mac-lucky/actions-shared-workflows/.github/actions/kubernetes-healthcheck@master
        with:
          app_label_selector: ${{ inputs.app_label_selector != '' && inputs.app_label_selector || inputs.app_name }}

      - name: Check logs
        run: |
          APP_LABEL="${{ inputs.app_label_selector }}"
          if [ -z "$APP_LABEL" ]; then
            APP_LABEL="${{ inputs.app_name }}"
          fi

          sleep 30
          echo "=== Application logs ==="
          kubectl logs -l app=$APP_LABEL -n monitoring --tail=50

      - name: Test metrics endpoint
        if: ${{ inputs.enable_custom_metrics_test }}
        run: |
          RELEASE_NAME="${{ inputs.helm_release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${{ inputs.app_name }}"
          fi

          echo "=== Testing metrics endpoint ==="
          kubectl port-forward -n monitoring svc/$RELEASE_NAME ${{ inputs.metrics_port }}:${{ inputs.metrics_port }} &
          PF_PID=$!
          sleep 10

          # Test metrics endpoint
          response=$(curl -s http://localhost:${{ inputs.metrics_port }}/metrics)
          if echo "$response" | grep -q "${{ inputs.metrics_test_pattern }}"; then
            echo "✅ Metrics endpoint working - ${{ inputs.metrics_test_pattern }} found"
            echo "Sample metrics:"
            echo "$response" | head -20
          else
            echo "❌ Metrics endpoint not working - ${{ inputs.metrics_test_pattern }} not found"
            echo "Response received:"
            echo "$response"
            kill $PF_PID || true
            exit 1
          fi

          # Cleanup
          kill $PF_PID || true

      - name: Cleanup
        if: always()
        run: |
          RELEASE_NAME="${{ inputs.helm_release_name }}"
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="${{ inputs.app_name }}"
          fi
          
          helm uninstall $RELEASE_NAME -n monitoring || true
          kubectl delete namespace monitoring || true

  # Job 7: Build platform-specific images in parallel
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [check-changes, setup, code-analysis, go-test, build-container, container-test, kubernetes-test]
    # always() switches off the implicit "skip when a dependency failed" rule, so
    # every gate has to be checked explicitly or a failed job still publishes.
    # code-analysis and go-test are gated here (not via build-container, which
    # runs in parallel with them); skipped passes because both are opt-out or
    # event-gated. Publishing is tag-gated; the only other publish path is the
    # opt-in :main dev image.
    if: ${{ always() && needs.build-container.result == 'success' && (needs.code-analysis.result == 'success' || needs.code-analysis.result == 'skipped') && (needs.go-test.result == 'success' || needs.go-test.result == 'skipped') && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch) && needs.check-changes.outputs.code-changed == 'true')) && (inputs.enable_container_tests == false || needs.container-test.result == 'success' || needs.container-test.result == 'skipped') && (inputs.enable_kubernetes_tests == false || needs.kubernetes-test.result == 'success' || needs.kubernetes-test.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ inputs.runner_amd64 }}
          - platform: linux/arm64
            runner: ${{ inputs.runner_arm64 }}
    outputs:
      new-version: ${{ steps.set_version.outputs.new_version }}
      version: ${{ steps.rel.outputs.version }}
      major_minor: ${{ steps.rel.outputs.major_minor }}
      major: ${{ steps.rel.outputs.major }}
      is_pre_one: ${{ steps.rel.outputs.is_pre_one }}
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        if: ${{ !inputs.skip_qemu_setup }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Compute release version (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: rel
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          SEMVER_TAG="${REF##*/}"
          VERSION="${SEMVER_TAG#v}"
          # The version is interpolated into shell steps and image tags, and it
          # derives from a ref name any writer can craft: accept bare semver only.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Refusing to build: tag '$REF' is not a semver tag."
            exit 1
          fi
          MAJOR_MINOR="${VERSION%.*}"
          MAJOR="${VERSION%%.*}"
          if [[ "$MAJOR" == "0" ]]; then IS_PRE_ONE=true; else IS_PRE_ONE=false; fi
          {
            echo "version=$VERSION"
            echo "major_minor=$MAJOR_MINOR"
            echo "major=$MAJOR"
            echo "is_pre_one=$IS_PRE_ONE"
          } >> "$GITHUB_OUTPUT"

      - name: Set version
        id: set_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NEW_VERSION="${{ steps.rel.outputs.version }}"
          elif [[ "${{ inputs.enable_main_dev_tag }}" == "true" && "$GITHUB_REF" == "refs/heads/${{ inputs.main_branch }}" ]]; then
            NEW_VERSION="main-${GITHUB_SHA:0:7}"
          else
            echo "Refusing to build: unexpected ref ${GITHUB_REF} reached the publish job."
            exit 1
          fi
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.rel.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.rel.outputs.major_minor }},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(steps.rel.outputs.version, '-') }}
            type=raw,value=${{ steps.rel.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/') && steps.rel.outputs.is_pre_one == 'false' && !contains(steps.rel.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(steps.rel.outputs.version, '-') }}
            type=raw,value=main,enable=${{ inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch) }}
            type=sha,prefix=main-,format=short,enable=${{ inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch) }}

      # Build this single arch into the local daemon so it can be scanned before push
      # (single-platform builds support load:true; multi-platform ones do not). Warms
      # the gha cache (mode=max) for the push build below.
      - name: Build image for scan
        id: build-local
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ needs.setup.outputs.go-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          load: true
          push: false
          tags: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=build-${{ env.PLATFORM_PAIR }},mode=max

      # Scan the built image; with fail-build:true a gating finding fails the job so the
      # push step never runs and merge (needs: build) is skipped - nothing is published.
      - name: Container security scan (Grype)
        id: scan
        if: ${{ inputs.enable_security_scan }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.app_name }}:scan-${{ env.PLATFORM_PAIR }}
          severity-cutoff: ${{ inputs.scan_severity_cutoff }}
          only-fixed: ${{ inputs.scan_only_fixed }}
          fail-build: ${{ inputs.scan_fail_build }}

      - name: Upload scan SARIF
        continue-on-error: true
        if: ${{ inputs.enable_security_scan && always() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-${{ env.PLATFORM_PAIR }}

      # Cache hit from the scan build above; only exports/pushes layers by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=${{ needs.setup.outputs.go-version }}
            VERSION=${{ env.NEW_VERSION }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE_GHCR }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Job 8: Merge platform-specific images into multi-arch manifest
  merge:
    name: Create Multi-arch Manifest
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, build]
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || (inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch))) }}
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prepare version
        run: echo "NEW_VERSION=${{ needs.build.outputs.new-version }}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY_IMAGE_GHCR }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ needs.build.outputs.major_minor }},enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(needs.build.outputs.version, '-') }}
            type=raw,value=${{ needs.build.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/') && needs.build.outputs.is_pre_one == 'false' && !contains(needs.build.outputs.version, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(needs.build.outputs.version, '-') }}
            type=raw,value=main,enable=${{ inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch) }}
            type=sha,prefix=main-,format=short,enable=${{ inputs.enable_main_dev_tag && github.ref == format('refs/heads/{0}', inputs.main_branch) }}

      - name: Log in to Docker Hub
        if: ${{ inputs.push_to_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create manifest list and push (GHCR)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Create manifest list and push (Docker Hub)
        if: ${{ inputs.push_to_dockerhub }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          LATEST=""
          case "${{ env.NEW_VERSION }}" in
            *-*) ;;  # prerelease never moves latest, matching the GHCR tag set
            *) LATEST="-t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:latest" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE_DOCKERHUB }}:${{ env.NEW_VERSION }} \
            $LATEST \
            $(printf '${{ env.REGISTRY_IMAGE_GHCR }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}

      - name: Generate SBOM
        if: ${{ inputs.enable_sbom }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY_IMAGE_GHCR }}:${{ env.NEW_VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  # Job 9: Post-deployment verification
  post-deploy-verify:
    name: Post-deployment Verification
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Verify deployed image
        uses: mac-lucky/actions-shared-workflows/.github/actions/verify-deployed-image@master
        with:
          registry_image: ${{ env.REGISTRY_IMAGE_GHCR }}
          github_token: ${{ github.token }}
          tag: ${{ needs.build.outputs.new-version }}

  # Job 10: GitHub Release with generated notes
  # No permissions block on purpose: it inherits the caller job's grant, which
  # must include contents:write for tag runs. Declaring it here would instead
  # compile-fail every caller that grants less on every event.
  release:
    name: GitHub Release
    runs-on: ${{ inputs.runner_default }}
    needs: [build, merge]
    if: ${{ always() && needs.merge.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download SBOM artifact
        if: ${{ inputs.enable_sbom }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}
          path_filter: ${{ inputs.release_notes_path_filter }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=""
          if [ -f sbom.spdx.json ]; then
            ASSETS="sbom.spdx.json"
          fi
          # Idempotent: re-running a tag workflow (a normal recovery path) must
          # refresh the release, not die on "already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            if [ -n "$ASSETS" ]; then
              # shellcheck disable=SC2086
              gh release upload "${GITHUB_REF_NAME}" $ASSETS --clobber
            fi
          else
            # shellcheck disable=SC2086
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              $ASSETS
          fi

  # Job 11: the single status check a branch ruleset should require.
  # Every other job name here ends in a matrix expansion, so a ruleset naming
  # them directly breaks whenever a platform or analysis tool is added or
  # renamed. This name is fixed, so callers only ever have to require
  # "<caller job id> / All checks passed".
  # No permissions block on purpose, for the same reason as the release job.
  all-checks:
    name: All checks passed
    runs-on: ${{ inputs.runner_default }}
    needs: [check-changes, setup, code-analysis, go-test, build-container, container-test, kubernetes-test, build, merge, post-deploy-verify, release]
    if: ${{ always() }}
    steps:
      # skipped counts as a pass: most jobs here are gated on event type or on
      # an opt-in input, so a PR run legitimately skips much of the workflow
      # and must still report green.
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more jobs failed or were cancelled"
          exit 1
