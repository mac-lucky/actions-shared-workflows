name: Scheduled GHCR Cleanup

on:
  schedule:
    - cron: '0 1 * * *'  # 3am Warsaw (CEST) / 2am (CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log deletions without performing them
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: Cleanup ${{ matrix.image }}
    runs-on: ubuntu-latest
    # No continue-on-error: fail-fast:false already stops one bad image from
    # cancelling the rest, and continue-on-error additionally reports the job as
    # successful whatever happens in it.
    strategy:
      fail-fast: false
      # Every job shares one token, and GitHub's secondary rate limit prices a
      # DELETE at 5 points against a 900/min budget.
      max-parallel: 2
      matrix:
        image:
          - bambulab-timelapse-downloader
          - bazarr-auto-translate
          - caddy-cloudflare
          - claude-code
          - derper
          - gocryptfs-docker
          - infra-ci
          - kubernetes-ping-exporter
          - landing-page
          - plausible-exporter
          - pushward-ai
          - pushward-backrest
          - pushward-bambulab
          - pushward-forgejo
          - pushward-github
          - pushward-grafana
          - pushward-mcp
          - pushward-relay
          - pushward-sabnzbd
          - pushward-server
          - pushward-web
          - ux-ui-site
          - webhook-capture
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cleanup untagged versions
        uses: ./.github/actions/cleanup-ghcr
        with:
          registry_image: ghcr.io/mac-lucky/${{ matrix.image }}
          github_token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          # inputs is null on a schedule run, so compare instead of passing it through
          dry_run: ${{ inputs.dry_run == true }}
