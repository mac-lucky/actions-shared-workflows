name: Scheduled GHCR Cleanup

on:
  schedule:
    - cron: '0 1 * * *'  # 3am Warsaw (CEST) / 2am (CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log deletions without performing them
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

jobs:
  # The image list is discovered, not hand-maintained: the static matrix
  # drifted in both directions twice (missing live images whose untagged
  # versions then piled up; dead entries for deleted packages). Same discovery
  # scan-ghcr-scheduled.yml uses.
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: List container packages
        id: list
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN }}
        run: |
          set -euo pipefail
          images=$(gh api --paginate "/user/packages?package_type=container&per_page=100" \
            -q '[.[].name]' | jq -sc 'add | sort')
          count=$(jq length <<< "$images")
          if [ "$count" -eq 0 ]; then
            echo "::error::No container packages returned - check GHCR_CLEANUP_TOKEN scope"
            exit 1
          fi
          echo "Discovered $count images"
          jq -r '.[]' <<< "$images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Cleanup ${{ matrix.image }}
    needs: discover
    runs-on: ubuntu-latest
    # No continue-on-error: fail-fast:false already stops one bad image from
    # cancelling the rest, and continue-on-error additionally reports the job as
    # successful whatever happens in it.
    strategy:
      fail-fast: false
      # Every job shares one token, and GitHub's secondary rate limit prices a
      # DELETE at 5 points against a 900/min budget.
      max-parallel: 2
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cleanup untagged versions
        uses: ./.github/actions/cleanup-ghcr
        with:
          registry_image: ghcr.io/mac-lucky/${{ matrix.image }}
          github_token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          # inputs is null on a schedule run, so compare instead of passing it through
          dry_run: ${{ inputs.dry_run == true }}
