name: Scheduled GHCR Cleanup

on:
  schedule:
    - cron: '0 1 * * *'  # 3am Warsaw (CEST) / 2am (CET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log deletions without performing them
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: Cleanup ${{ matrix.image }}
    runs-on: ubuntu-latest
    # No continue-on-error: fail-fast:false already keeps one bad image from
    # stopping the rest, while continue-on-error also hid the failure from the
    # run conclusion - deletions were failing nightly behind a green check.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image:
          - bambulab-timelapse-downloader
          - bazarr-auto-translate
          - caddy-cloudflare
          - claude-code
          - derper
          - gocryptfs-docker
          - homeassistant-mcp
          - homelab-doctor
          - kubernetes-ping-exporter
          - nodered-mcp-server
          - portfolio
          - pushward-bambulab
          - pushward-github
          - pushward-grafana
          - pushward-relay
          - pushward-sabnzbd
          - pushward-server
          - pushward-unraid
          - pushward-web
          - tcp-endpoint-check-exporter
          - ux-ui-site
          - webhook-capture
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup untagged versions
        uses: ./.github/actions/cleanup-ghcr
        with:
          registry_image: ghcr.io/mac-lucky/${{ matrix.image }}
          github_token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          # inputs is null on a schedule run, so compare instead of passing it through
          dry_run: ${{ inputs.dry_run == true }}
